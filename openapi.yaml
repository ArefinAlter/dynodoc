openapi: 3.1.0
info:
  title: dynodoc engine API
  description: Document version control, collaborative review and authorized administration. Canonical content history is append-only except explicit audited whole-document erasure.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  version: 0.1.0
paths:
  /admin/actions:
    post:
      tags:
      - administration
      operationId: action
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/control:
    post:
      tags:
      - administration
      operationId: control
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/erase:
    post:
      tags:
      - administration
      operationId: erase
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/impact:
    get:
      tags:
      - administration
      operationId: impact
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/overview:
    get:
      tags:
      - administration
      operationId: overview
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/records:
    get:
      tags:
      - administration
      operationId: records
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /documents:
    get:
      tags:
      - documents
      summary: List accessible (non-archived) documents, cursor-paginated. `[document member]`.
      operationId: list_documents
      parameters:
      - name: status
        in: query
        description: Filter by lifecycle status
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: Opaque pagination cursor
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size (1..=1000)
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: A page of documents, `{ items, next_cursor }`
          content:
            application/json:
              schema: {}
    post:
      tags:
      - documents
      summary: Create a new document; the creator becomes its `Author`. `[Sponsor/creator]`.
      operationId: create_document
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
        required: true
      responses:
        '200':
          description: The created document
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid body
      security:
      - bearer: []
  /documents/{id}:
    get:
      tags:
      - documents
      summary: Document metadata + current materialized state. `[document member]`.
      operationId: get_document
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Document detail (metadata + materialized state)
          content:
            application/json:
              schema: {}
        '404':
          description: No such document
  /documents/{id}/access:
    get:
      tags:
      - product
      operationId: document_access
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /documents/{id}/batch:
    post:
      tags:
      - workspace
      operationId: batch
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
  /documents/{id}/conflicts:
    get:
      tags:
      - conflicts
      summary: List the live four-card conflicts for a document. `[auth]`.
      operationId: list_conflicts
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'Live conflicts, `{ items: [ConflictView...] }`'
          content:
            application/json:
              schema: {}
        '404':
          description: No such document
      security:
      - bearer: []
  /documents/{id}/conflicts/{conflict_id}/resolve:
    post:
      tags:
      - conflicts
      summary: Resolve one conflict. `[Author]`.
      operationId: resolve
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      - name: conflict_id
        in: path
        description: Opaque conflict id from GET /conflicts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
        required: true
      responses:
        '200':
          description: 'The appended canonical events, `{ events: [...] }`'
          content:
            application/json:
              schema: {}
        '400':
          description: Neither/both decision fields set, or an unknown suggestion id
        '403':
          description: Not the document author
        '404':
          description: No such document or live conflict
      security:
      - bearer: []
  /documents/{id}/deploy:
    post:
      tags:
      - operations
      summary: |-
        Mark a deployed checkpoint (runs the referential-integrity gate, pins a snapshot).
        `[Sponsor]`.
      operationId: deploy
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The Deployed event
          content:
            application/json:
              schema: {}
        '409':
          description: 'Deploy refused: referential-integrity violations'
      security:
      - bearer: []
  /documents/{id}/discussions:
    get:
      tags:
      - discussions
      operationId: list
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /documents/{id}/discussions/{thread}:
    post:
      tags:
      - discussions
      operationId: change
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      - name: thread
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /documents/{id}/drafts:
    get:
      tags:
      - workspace
      operationId: drafts
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
    post:
      tags:
      - workspace
      operationId: create_draft
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
  /documents/{id}/drafts/{draft_id}:
    get:
      tags:
      - workspace
      operationId: get_draft
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
    post:
      tags:
      - workspace
      operationId: edit_draft
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
  /documents/{id}/drafts/{draft_id}/sync:
    post:
      tags:
      - workspace
      operationId: sync_draft
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
  /documents/{id}/events:
    get:
      tags:
      - documents
      summary: |-
        Raw, cursor-paginated event log for a document. `[auth]` — the audit stream is for
        authenticated participants, not the public read path.
      operationId: list_events
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      - name: from_seq
        in: query
        description: Lowest seq to return
        required: false
        schema:
          type: integer
          format: int64
      - name: to_seq
        in: query
        description: Highest seq to return
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque pagination cursor
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size (1..=1000)
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: A page of events, `{ items, next_cursor }`
          content:
            application/json:
              schema: {}
      security:
      - bearer: []
  /documents/{id}/location:
    post:
      tags:
      - product
      operationId: move_document
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /documents/{id}/members:
    get:
      tags:
      - workspace
      operationId: members
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
    post:
      tags:
      - workspace
      operationId: share
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
  /documents/{id}/merkle-proof/{event_id}:
    get:
      tags:
      - audit
      summary: Inclusion proof for an event within the latest snapshot's covered range. `[document member]`.
      operationId: merkle_proof
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      - name: event_id
        in: path
        description: Event id (ULID)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Inclusion proof
          content:
            application/json:
              schema: {}
        '404':
          description: No snapshot, or event not in range
  /documents/{id}/metadata:
    post:
      tags:
      - workspace
      operationId: metadata
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
  /documents/{id}/node/{node_id}:
    get:
      tags:
      - documents
      summary: A single node's current materialized state. `[document member]`.
      operationId: get_node
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      - name: node_id
        in: path
        description: Node id (ULID)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Node state
          content:
            application/json:
              schema: {}
        '404':
          description: No such document or node
  /documents/{id}/ops/comment:
    post:
      tags:
      - operations
      summary: Add a comment, optionally anchored to a node. `[T2+]`.
      operationId: op_comment
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
        required: true
      responses:
        '200':
          description: The appended event
          content:
            application/json:
              schema: {}
      security:
      - bearer: []
  /documents/{id}/ops/field-edit:
    post:
      tags:
      - operations
      summary: Edit a single field of a node. `[T2+]`.
      operationId: op_field_edit
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldEditRequest'
        required: true
      responses:
        '200':
          description: The appended event
          content:
            application/json:
              schema: {}
      security:
      - bearer: []
  /documents/{id}/ops/node-create:
    post:
      tags:
      - operations
      summary: Create a node. `[T2+]` (Author/Reviewer-via-suggest in the PoC role model).
      operationId: op_node_create
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeCreateRequest'
        required: true
      responses:
        '200':
          description: The appended event
          content:
            application/json:
              schema: {}
      security:
      - bearer: []
  /documents/{id}/ops/suggest:
    post:
      tags:
      - operations
      summary: Propose a wrapped change without applying it (the suggesting workflow). `[T2+]`.
      operationId: op_suggest
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestRequest'
        required: true
      responses:
        '200':
          description: The appended proposal event
          content:
            application/json:
              schema: {}
      security:
      - bearer: []
  /documents/{id}/proposals/{event_id}/accept:
    post:
      tags:
      - operations
      summary: |-
        Accept a pending proposal (atomic: applies the wrapped op + records acceptance).
        `[Sponsor]` (Author in the PoC role model). The `:event_id` path segment is the
        suggestion id.
      operationId: accept
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      - name: event_id
        in: path
        description: Suggestion id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The canonical wrapped event
          content:
            application/json:
              schema: {}
      security:
      - bearer: []
  /documents/{id}/proposals/{event_id}/reject:
    post:
      tags:
      - operations
      summary: Reject a pending proposal (recorded with its reason, never applied). `[Sponsor]`.
      operationId: reject
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      - name: event_id
        in: path
        description: Suggestion id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
        required: true
      responses:
        '200':
          description: The rejection event
          content:
            application/json:
              schema: {}
      security:
      - bearer: []
  /documents/{id}/public-links:
    get:
      tags:
      - product
      operationId: public_links
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
    post:
      tags:
      - product
      operationId: publish
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /documents/{id}/public-links/{link}/revoke:
    post:
      tags:
      - product
      operationId: revoke
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      - name: link
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /documents/{id}/snapshot/{snapshot_id}:
    get:
      tags:
      - audit
      summary: A full snapshot, including its Merkle root and bound chain hash. `[document member]`.
      operationId: get_snapshot
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      - name: snapshot_id
        in: path
        description: Snapshot id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The snapshot
          content:
            application/json:
              schema: {}
        '404':
          description: No such snapshot for this document
  /documents/{id}/structure:
    get:
      tags:
      - workspace
      summary: |-
        Derived ontology/provenance view, permissioned exactly like document content.
        It is not an additional source of truth and does not require a graph database.
      operationId: structure
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Formatting-run classification and revision provenance
          content:
            application/json:
              schema: {}
        '403':
          description: Document membership required
  /documents/{id}/trash:
    post:
      tags:
      - product
      operationId: trash_document
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
