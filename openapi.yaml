components:
  schemas:
    Action:
      type: string
      enum:
      - preview
      - create
    CommentRequest:
      type: object
      description: '`POST /ops/comment`.'
      required:
      - body
      properties:
        body:
          type: string
        node_id:
          type:
          - string
          - 'null'
    ConflictOption:
      type: object
      description: |-
        A single proposed value in a four-card conflict, attributable to the pending
        suggestion (and, when the route enriches it, the actor) that proposed it.
      required:
      - suggestion_id
      - value
      properties:
        actor:
          type:
          - string
          - 'null'
          description: |-
            The identity that proposed the suggestion, when known. Pure derivation from
            state cannot supply this (the materializer does not carry the proposer), so the
            derive helper leaves it `None` and the GET route fills it from the event log.
        suggestion_id:
          type: string
          description: The pending suggestion this option came from (the id `resolve` accepts).
        value:
          description: The value this suggestion would write to the field.
    ConflictView:
      type: object
      description: 'One four-card conflict: a `(node_id, field)` whose pending suggestions disagree.'
      required:
      - conflict_id
      - node_id
      - field
      - options
      properties:
        ancestor:
          description: |-
            The current canonical field value (the "Original" card), or `None` if the field
            has no value yet.
        conflict_id:
          type: string
          description: Opaque, deterministic encoding of `(node_id, field)` (see module docs).
        field:
          type: string
        node_id:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/ConflictOption'
          description: The competing proposals (≥2, each a distinct value).
    CreateDocumentRequest:
      type: object
      description: Body for `POST /documents`.
      required:
      - title
      properties:
        languages:
          type: array
          items:
            type: string
        title:
          type: string
    FieldEditRequest:
      type: object
      description: '`POST /ops/field-edit`.'
      required:
      - node_id
      - field
      - value
      properties:
        base_seq:
          type:
          - integer
          - 'null'
          format: int64
        field:
          type: string
        node_id:
          type: string
        value: {}
    GrantInput:
      type: object
      required:
      - host
      properties:
        expires_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Approval link expiry as Unix seconds; ten minutes plus one minute clock allowance.
        host:
          type: string
        key_challenge:
          type:
          - string
          - 'null'
          description: SHA-256 of a 256-bit secret held by the requesting editor. Never the secret.
      additionalProperties: false
    Mode:
      type: string
      enum:
      - restore
      - revert
      - cherry_pick
    NodeCreateRequest:
      type: object
      description: '`POST /ops/node-create`. `node_id` is optional; absent, the server mints a ULID.'
      required:
      - node_type
      - pos
      properties:
        fields: {}
        node_id:
          type:
          - string
          - 'null'
        node_type:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        pos:
          type: string
        var_name:
          type:
          - string
          - 'null'
    RecoveryRequest:
      type: object
      required:
      - through_seq
      properties:
        action:
          $ref: '#/components/schemas/Action'
          description: Preview by default. Create makes a private draft, never a canonical edit.
        base_seq:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Required on create: the team revision returned by preview.'
        from_seq:
          type:
          - integer
          - 'null'
          format: int64
          description: Range start (exclusive), required for revert/cherry-pick. End is through_seq.
        mode:
          $ref: '#/components/schemas/Mode'
          description: Restore content, reverse a revision range, or apply that range again.
        node_ids:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Omit for all content; otherwise select 1-5000 unique logical block IDs.
        request_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Required on create. Keep the same UUID and request on a retry.
        resolutions:
          type: object
          description: 'Explicit overlap choices returned by preview: conflict key -> team or draft.'
          additionalProperties:
            type: string
          propertyNames:
            type: string
        through_seq:
          type: integer
          format: int64
          description: Exact retained event revision, including zero for the empty initial state.
      additionalProperties: false
    RejectRequest:
      type: object
      description: '`POST /proposals/:event_id/reject`.'
      properties:
        reason:
          type:
          - string
          - 'null'
    ResolveRequest:
      type: object
      description: '`POST .../resolve` body. Exactly one of the two fields must be set.'
      properties:
        accept_suggestion_id:
          type:
          - string
          - 'null'
          description: Accept this competing proposal's value as canonical.
        custom_value:
          description: Override all proposals with this custom value.
    SuggestRequest:
      type: object
      description: '`POST /ops/suggest`. `detail` is the wrapped content op (internally-tagged JSON).'
      required:
      - detail
      properties:
        detail: {}
        suggestion_id:
          type:
          - string
          - 'null'
        target_node_id:
          type:
          - string
          - 'null'
  securitySchemes:
    connector_key:
      type: http
      scheme: bearer
      bearerFormat: 64 hexadecimal characters; file-scoped editor key
    paseto:
      type: http
      scheme: bearer
      bearerFormat: PASETO v4.local
tags:
- name: documents
  description: Document read + create
- name: operations
  description: The write path (governance-gated)
- name: conflicts
  description: Four-card conflict resolution
- name: audit
  description: Member-only hash-chain audit endpoints
