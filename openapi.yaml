  /projects/{id}/agent/proposals:
    get:
      tags:
      - agent
      summary: |-
        The agent's own proposals in this project (the list the `status` tool lacked): each with
        its state, base, head, revision and size, newest first, open ones before closed. Only the
        proposals of the agent identity of this key's product, in files the person can open and the
        policy shows; a key that has no agent identity yet has none.
      operationId: agent_proposals
      parameters:
      - name: id
        in: path
        description: Project
        required: true
        schema:
          type: string
          format: uuid
      - name: state
        in: query
        description: active (draft, open and changes_requested; the default), all, or one of draft, open, changes_requested, merged, declined, withdrawn
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: 0 to 1000
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: 1 to 50, default 20
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 'This agent''s proposals in the project, newest activity first: proposal (the id the submit, withdraw and status routes take), file, state, base, head, behind, revision, edits (engine operations stored), created_at and submitted_at; more says whether another page exists; the budget fields say how many proposals the person''s agents have opened today and have open against the limits. Ids, numbers and states only'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProposalList'
            text/vnd.dynodoc.dct; v=1:
              schema:
                type: string
        '400':
          description: Unknown state, or offset or limit out of range
        '401':
          description: Not a project device session
        '403':
          description: Scope, grant, key class, membership or policy refuses
        '429':
          description: Budget
      security:
      - device_session:
        - content:read
  /projects/{id}/agent/proposals/{proposal}:
    get:
      tags:
      - agent
      summary: |-
        The state of one proposal of the agent (spec 7.9): where it is in review, what the
        reviewers said, how far behind the team version it is and where a merge would conflict.
      operationId: agent_proposal_status
      parameters:
      - name: id
        in: path
        description: Project
        required: true
        schema:
          type: string
          format: uuid
      - name: proposal
        in: path
        description: Proposal id from propose
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'state is draft, open, changes_requested, declined, merged or withdrawn; base and head revisions and behind; the approvals counted and required; the latest reviews (verdict, reviewer name, bounded note: all untrusted text, trust=data); and, while the proposal is not closed, the same-field conflicts a merge would meet by ref, field and short hashes (never content)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProposalStatus'
            text/vnd.dynodoc.dct; v=1:
              schema:
                type: string
        '401':
          description: Not a project device session
        '403':
          description: Scope, grant, key class, membership or policy refuses
        '404':
          description: No such proposal of this agent (one answer for every reason)
        '429':
          description: Budget
      security:
      - device_session:
        - content:read
  /projects/{id}/agent/proposals/{proposal}/submit:
    post:
      tags:
      - agent
      summary: |-
        Send the agent's proposal to the file's reviewers, when the project lets an agent
        (spec 7.8). You cannot approve, decline or merge.
      operationId: agent_submit
      parameters:
      - name: id
        in: path
        description: Project
        required: true
        schema:
          type: string
          format: uuid
      - name: proposal
        in: path
        description: Proposal id from propose
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Optional note for the reviewers, at most 1000 characters; the body may be empty
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentNoteBody'
        required: true
      responses:
        '200':
          description: 'state is open (submitted now, or already open: nothing is written twice), or awaiting_person when the project requires a person to submit (nothing changed: a person submits it from the app). Notifies the reviewers when it submits. changed says whether this call did'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSubmit'
            text/vnd.dynodoc.dct; v=1:
              schema:
                type: string
        '400':
          description: Invalid body or note
        '401':
          description: Not a project device session
        '403':
          description: Scope, grant, key class, membership, role or policy (write_mode) refuses
        '404':
          description: No such proposal of this agent (one answer for every reason; a malformed id is 404 before authentication)
        '409':
          description: 'proposal_closed: merged, declined or withdrawn'
        '429':
          description: Budget
      security:
      - device_session:
        - content:submit
