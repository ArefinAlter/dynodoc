components:
  schemas:
    AccessRequest:
      type: object
      required:
      - project_access
      properties:
        confirm_all_projects:
          type: boolean
          description: Must be `true` to choose `all`; ignored for `granted`.
        project_access:
          type: string
          description: |-
            `granted` (only projects with an active grant) or `all` (every project the
            account can access; requires `confirm_all_projects`).
      additionalProperties: false
    Action:
      type: string
      enum:
      - preview
      - create
    AgentAccess:
      type: object
      description: '`access` (`status what=access`).'
      required:
      - protocol
      - tool
      - what
      - project
      - role
      - scopes
      - write_mode
      - submit_requires_person
      - budget
      - capabilities
      properties:
        budget:
          type: object
          description: |-
            The grant's budgets in this project: `calls_per_minute` and `read_bytes_per_day`,
            each `{limit, used}`; and, when writing is on, `proposals_per_day` and
            `open_proposals` (`{limit, used}`, counted for the agent identity) and
            `ops_per_proposal` (`{limit}`).
        capabilities:
          type: object
          description: |-
            What this credential can do now: `propose` and `submit` are true only when its grant
            has the scope and the project's policy lets the agent do it.
        project:
          type: string
        protocol:
          type: string
        role:
          type: string
          description: The principal's current role in the project.
        scopes:
          type: array
          items:
            type: string
          description: Scopes of the grant that is active now.
        submit_requires_person:
          type: boolean
          description: Whether a person must submit an agent's draft even in `change_request` mode.
        tool:
          type: string
        what:
          type: string
        write_mode:
          type: string
          description: 'The project''s `write_mode`: `none` (agents only read), `draft` or `change_request`.'
    AgentBlockRow:
      type: object
      required:
      - ref
      - t
      - h
      - w
      - p
      properties:
        h:
          type: string
          description: 6-hex content hash.
        p:
          type: string
          description: Preview (escaped).
        ref:
          type: string
        t:
          type: string
          description: Block type (`P`, `H1`..`H6`, `UL<n>`, `OL<n>`, `TBL<r>x<c>`, `CODE`, ...).
        under:
          type:
          - array
          - 'null'
          items:
            type: integer
            minimum: 0
          description: 'Depth 0 only: `[blocks, words]` under the heading.'
        w:
          type: integer
          description: Words.
          minimum: 0
    AgentColumnProfile:
      type: object
      required:
      - col
      - header
      - type
      - n
      - blank
      - distinct_over
      - top
      - exceptions
      - exceptions_more
      properties:
        blank:
          type: integer
          minimum: 0
        col:
          type: string
        distinct:
          type:
          - integer
          - 'null'
          minimum: 0
        distinct_over:
          type: boolean
        exceptions:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
        exceptions_more:
          type: integer
          minimum: 0
        header:
          type: string
        max:
          type:
          - number
          - 'null'
          format: double
        min:
          type:
          - number
          - 'null'
          format: double
        n:
          type: integer
          minimum: 0
        pattern:
          type:
          - string
          - 'null'
        sum:
          type:
          - number
          - 'null'
          format: double
        top:
          type: array
          items:
            type: object
          description: Up to 5 `[value, count]` pairs, only when few distinct values.
        type:
          type: string
          description: '`num`, `text`, `date`, `bool`, `formula` or `mixed`.'
    AgentConflict:
      type: object
      required:
      - field
      - team
      - draft
      properties:
        draft:
          type: string
        field:
          type: string
          description: The engine field both sides changed.
        ref:
          type:
          - string
          - 'null'
        team:
          type: string
          description: Six-hex hashes of the team's and the draft's value; never the values.
    AgentDiff:
      allOf:
      - $ref: '#/components/schemas/AgentEnvelope'
      - type: object
        required:
        - from
        - to
        - blocks
        - changed
        - added
        - removed
        - moved
        - entries
        properties:
          added:
            type: integer
            minimum: 0
          blocks:
            type: integer
            minimum: 0
          changed:
            type: integer
            minimum: 0
          entries:
            type: array
            items:
              $ref: '#/components/schemas/AgentDiffEntry'
          from:
            type: integer
            format: int64
            minimum: 0
          more:
            type:
            - string
            - 'null'
          moved:
            type: integer
            minimum: 0
          removed:
            type: integer
            minimum: 0
          to:
            type: integer
            format: int64
            minimum: 0
      description: '`diff`.'
    AgentDiffEntry:
      type: object
      required:
      - op
      - ref
      - t
      - detail
      properties:
        after:
          type:
          - string
          - 'null'
        cells:
          type:
          - integer
          - 'null'
          minimum: 0
        chars:
          type:
          - array
          - 'null'
          items:
            type: integer
            minimum: 0
          description: '`[deleted, inserted]` characters.'
        detail:
          type: array
          items:
            type: string
          description: Escaped detail lines (`detail=text`).
        new:
          type:
          - string
          - 'null'
        old:
          type:
          - string
          - 'null'
        op:
          type: string
          description: '`~` changed, `+` added, `-` removed, `>` moved.'
        pos:
          type:
          - integer
          - 'null'
          minimum: 0
        preview:
          type:
          - string
          - 'null'
        ref:
          type: string
        row:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        scope:
          type:
          - string
          - 'null'
        t:
          type: string
    AgentDiscovery:
      type: object
      description: The discovery document.
      required:
      - protocol
      - dct
      - http
      - mcp
      - mcp_revisions
      - scopes
      - write_scopes
      - limits
      - profiles
      - capabilities
      properties:
        capabilities:
          type: object
        dct:
          type: string
        http:
          type: object
        limits:
          type: object
        mcp:
          type: object
          description: Null until an MCP server is deployed.
        mcp_revisions:
          type: array
          items:
            type: string
        profiles:
          type: array
          items:
            type: string
        protected_resource_metadata:
          type:
          - string
          - 'null'
        protocol:
          type: string
        scopes:
          type: array
          items:
            type: string
          description: The read scope (`content:read`), which every tool needs.
        write_scopes:
          type: array
          items:
            type: string
          description: |-
            The write scopes (`content:propose`, `content:submit`), independent of each other, and
            each held beside the read scope. A project must also set `write_mode`.
    AgentEnvelope:
      type: object
      description: The keys every JSON mirror starts with.
      required:
      - protocol
      - tool
      - trust
      properties:
        chain:
          type:
          - string
          - 'null'
          description: First 8 hex characters of the chain hash at `rev`.
        file:
          type:
          - string
          - 'null'
          description: Full document UUID (absent for `files`).
        protocol:
          type: string
          description: '`dynodoc.agent/1`.'
        rev:
          type:
          - integer
          - 'null'
          format: int64
          description: Event sequence the response was computed at; `0` is the empty initial state.
          minimum: 0
        tool:
          type: string
          description: '`files`, `outline`, `read`, `find`, `diff` or `status`.'
        trust:
          type: string
          description: 'Always `data`: every string below that came from a document is untrusted text.'
    AgentFileRow:
      type: object
      required:
      - file
      - id
      - kind
      - rev
      - project
      - role
      - title
      properties:
        file:
          type: string
          description: First 8 hex characters of the document UUID.
        id:
          type: string
          description: Full document UUID.
        kind:
          type: string
          description: '`document`, `spreadsheet` or `presentation`.'
        project:
          type: string
        rev:
          type: integer
          format: int64
          description: Head sequence.
          minimum: 0
        role:
          type: string
          description: The caller's current role on the file.
        title:
          type: string
    AgentFiles:
      allOf:
      - $ref: '#/components/schemas/AgentEnvelope'
      - type: object
        required:
        - n
        - files
        properties:
          files:
            type: array
            items:
              $ref: '#/components/schemas/AgentFileRow'
          more:
            type:
            - string
            - 'null'
          n:
            type: integer
            minimum: 0
      description: '`files`.'
    AgentFind:
      allOf:
      - $ref: '#/components/schemas/AgentEnvelope'
      - type: object
        required:
        - n
        - total
        - total_capped
        - hits
        properties:
          hits:
            type: array
            items:
              $ref: '#/components/schemas/AgentHit'
          more:
            type:
            - string
            - 'null'
          n:
            type: integer
            minimum: 0
          total:
            type: integer
            minimum: 0
          total_capped:
            type: boolean
      description: '`find`.'
    AgentHit:
      type: object
      required:
      - at
      - snippet
      - offset
      properties:
        at:
          type: string
          description: '`7C02`, `7C02.2`, `3B77.r2c1`, `R91W!C14` or `W2SK.A1B2`.'
        offset:
          type: integer
          description: Character offset of the match in the searched text.
          minimum: 0
        snippet:
          type: string
    AgentNoteBody:
      type: object
      description: Optional note on `submit` and `withdraw`.
      properties:
        note:
          type:
          - string
          - 'null'
          description: At most 1000 characters; no control or hidden characters.
    AgentOutline:
      allOf:
      - $ref: '#/components/schemas/AgentEnvelope'
      - type: object
        required:
        - kind
        - depth
        - count
        - unchanged
        properties:
          blocks:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/AgentBlockRow'
          count:
            type: integer
            description: Blocks, sheets or slides in the selection, before paging.
            minimum: 0
          depth:
            type: integer
            format: int32
            minimum: 0
          kind:
            type: string
          more:
            type:
            - string
            - 'null'
          oh:
            type:
            - string
            - 'null'
            description: 'Outline hash: pass it back as `if_none_match`.'
          profile:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AgentProfile'
          sheets:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/AgentSheetRow'
          slides:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/AgentSlideRow'
          unchanged:
            type: boolean
          words:
            type:
            - integer
            - 'null'
            minimum: 0
      description: '`outline` and the sheet profile.'
    AgentPreviewChange:
      type: object
      required:
      - ref
      - kind
      properties:
        kind:
          type: string
          description: '`changed`, `created`, `deleted` or `moved`.'
        new:
          type:
          - string
          - 'null'
        old:
          type:
          - string
          - 'null'
        ref:
          type: string
    AgentPreviewOp:
      type: object
      required:
      - index
      - op
      - engine_ops
      - changes
      - more_changes
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/AgentPreviewChange'
        engine_ops:
          type: integer
          minimum: 0
        id:
          type:
          - string
          - 'null'
          description: The agent's own label for the op.
        index:
          type: integer
          minimum: 0
        more_changes:
          type: integer
          minimum: 0
        op:
          type: string
        why:
          type:
          - string
          - 'null'
          description: The agent's reason (untrusted text).
    AgentProfile:
      type: object
      required:
      - name
      - rows
      - cols
      - header
      - freeze
      - merges
      - columns
      properties:
        cols:
          type: integer
          minimum: 0
        columns:
          type: array
          items:
            $ref: '#/components/schemas/AgentColumnProfile'
        freeze:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
          description: '`[frozen rows, frozen columns]`.'
        header:
          type: string
        merges:
          type: integer
          minimum: 0
        name:
          type: string
        rows:
          type: integer
          minimum: 0
    AgentProposalList:
      type: object
      description: The agent's own proposals in a project (the list route of the agent plane).
      required:
      - protocol
      - tool
      - what
      - state
      - n
      - more
      - write_mode
      - opened_today
      - opened_limit
      - open
      - open_limit
      - proposals
      - trust
      properties:
        more:
          type: boolean
        n:
          type: integer
          minimum: 0
        open:
          type: integer
          format: int64
        open_limit:
          type: integer
          format: int64
        opened_limit:
          type: integer
          format: int64
        opened_today:
          type: integer
          format: int64
          description: |-
            Proposals the person's agents opened since midnight UTC, and have open, against the
            project's limits.
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/AgentProposalRow'
          description: Absent from the DCT form, which lists them as `proposal` lines.
        protocol:
          type: string
        state:
          type: string
          description: 'The filter that was applied: `active`, `all` or one state.'
        tool:
          type: string
        trust:
          type: string
        what:
          type: string
        write_mode:
          type: string
    AgentProposalRow:
      type: object
      description: One proposal in `proposals` of the agent's own list.
      required:
      - proposal
      - file
      - state
      - base
      - head
      - behind
      - revision
      - edits
      - created_at
      properties:
        base:
          type: integer
          format: int64
          description: The team revision the proposal started from, and the file's head now.
        behind:
          type: integer
          format: int64
        created_at:
          type: string
        edits:
          type: integer
          format: int64
          description: Engine operations stored in the proposal.
        file:
          type: string
          description: Full document UUID.
        head:
          type: integer
          format: int64
        proposal:
          type: string
          description: The id the submit, withdraw and status routes take.
        revision:
          type: integer
          format: int64
        state:
          type: string
          description: '`draft`, `open`, `changes_requested`, `declined`, `merged` or `withdrawn`.'
        submitted_at:
          type:
          - string
          - 'null'
    AgentProposalStatus:
      type: object
      description: '`status` of a proposal.'
      required:
      - protocol
      - tool
      - what
      - proposal
      - file
      - state
      - base
      - head
      - behind
      - revision
      - edits
      - approvals
      - required
      - satisfied
      - conflicts
      - reviews
      - conflict_list
      - trust
      properties:
        approvals:
          type: integer
          format: int64
        base:
          type: integer
          format: int64
        behind:
          type: integer
          format: int64
          minimum: 0
        conflict_list:
          type: array
          items:
            $ref: '#/components/schemas/AgentConflict'
        conflicts:
          type: integer
          description: Same-field overlaps a merge would meet (the first 20 are in `conflict_list`).
          minimum: 0
        edits:
          type: integer
          format: int64
          description: Engine operations in the proposal.
          minimum: 0
        file:
          type: string
        head:
          type: integer
          format: int64
          minimum: 0
        merged_at:
          type:
          - string
          - 'null'
        proposal:
          type: string
        protocol:
          type: string
        required:
          type: integer
          format: int64
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/AgentReviewNote'
        revision:
          type: integer
          format: int64
        satisfied:
          type: boolean
        state:
          type: string
          description: '`draft`, `open`, `changes_requested`, `declined`, `merged` or `withdrawn`.'
        tool:
          type: string
        trust:
          type: string
        what:
          type: string
    AgentPropose:
      allOf:
      - $ref: '#/components/schemas/AgentEnvelope'
      - type: object
        required:
        - base
        - head
        - behind
        - applied
        - expanded
        - stale
        - stale_total
        - replayed
        - warn
        properties:
          applied:
            type: integer
            format: int64
            description: Ops applied (0 in a dry run).
            minimum: 0
          base:
            type: integer
            format: int64
            description: The proposal's base revision, the team's head, and how far behind it is.
          behind:
            type: integer
            format: int64
            minimum: 0
          dry_run:
            type:
            - boolean
            - 'null'
          entries:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/AgentDiffEntry'
          entries_total:
            type:
            - integer
            - 'null'
            minimum: 0
          expanded:
            type: integer
            format: int64
            description: Engine operations the ops became.
            minimum: 0
          head:
            type: integer
            format: int64
            minimum: 0
          opened:
            type:
            - boolean
            - 'null'
            description: Whether this call opened the proposal (a replay only).
          ops:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/AgentPreviewOp'
          proposal:
            type:
            - string
            - 'null'
            description: The proposal's id (absent in a dry run of a new proposal).
          replayed:
            type: boolean
          request_id:
            type:
            - string
            - 'null'
          revision:
            type:
            - integer
            - 'null'
            format: int64
            description: The draft's revision after the call.
          stale:
            type: array
            items:
              $ref: '#/components/schemas/AgentStale'
            description: The ops whose `base` was out of date (at most five in a replay).
          stale_total:
            type: integer
            format: int64
            minimum: 0
          state:
            type:
            - string
            - 'null'
            description: '`draft`, `open`, `merged`, `declined` or `withdrawn` (absent in a dry run).'
          truncated:
            type:
            - boolean
            - 'null'
          warn:
            type: array
            items:
              type: string
            description: '`stale`, `behind`, `truncated`.'
          would_apply:
            type:
            - integer
            - 'null'
            format: int64
            minimum: 0
      description: |-
        `propose`: the preview of the call (or of a dry run), or the stored receipt of a call
        already made (`replayed`; then `ops`, `entries`, `entries_total`, `would_apply` and
        `truncated` are absent).
    AgentProposeBody:
      type: object
      description: |-
        Body of `propose` (docs/AI-AGENT-PROTOCOL-SPEC.md 7.7). The file is the one in the path.
        Unknown fields are refused. `ops` items are flat objects validated strictly against
        the operation grammar (spec 8): `op` is one of `set_text`, `replace`, `replace_all`,
        `insert`, `delete`, `move`, `set_type`, `set_cells`, `clear`, `set_shape`, `set_notes`;
        the others (`fill`, `add_slide`, `delete_slide`, `macro`) are `unsupported_op`.
      required:
      - rev
      - request_id
      - ops
      properties:
        dry_run:
          type:
          - boolean
          - 'null'
          description: 'Compile and preview only: nothing is stored, no receipt is written.'
        file:
          type:
          - string
          - 'null'
          description: The file again (optional); if given it must be the file of the path.
        name:
          type:
          - string
          - 'null'
          description: A short title for reviewers (at most 200 characters; no control or hidden characters).
        ops:
          type: array
          items:
            type: object
          description: One to 200 ops, each `{op, ref|sheet|slide..., text|find|with|values..., base, why, id}`.
        proposal:
          type:
          - string
          - 'null'
          description: An existing proposal of this agent to extend; omit to start one.
        request_id:
          type: string
          description: |-
            A new UUID per call; reuse it only to retry. With the same canonical body it returns
            the stored receipt; with another body it is `idempotency_conflict`.
        return:
          type:
          - string
          - 'null'
          description: '`summary` (default) or `diff`.'
        rev:
          type: integer
          format: int64
          description: The revision the refs and hashes in `ops` came from (0 up to the head).
          minimum: 0
        strict:
          type:
          - boolean
          - 'null'
          description: |-
            Refuse an op whose `base` hash differs from the team's current hash (`stale_base`)
            instead of recording a warning.
