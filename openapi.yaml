openapi: 3.1.0
info:
  title: dynodoc engine API
  description: Document version control, collaborative review and authorized administration. Canonical content history is append-only except explicit audited whole-document erasure.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  version: 0.1.0
paths:
  /admin/actions:
    post:
      tags:
      - administration
      operationId: action
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/control:
    post:
      tags:
      - administration
      operationId: control
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/erase:
    post:
      tags:
      - administration
      operationId: erase
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/erase-batch:
    post:
      tags:
      - administration
      summary: |-
        Permanently delete up to 100 documents, each in its own audited transaction with
        its own receipt. One failure does not stop the others.
      operationId: erase_batch
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Per-document results
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
      security:
      - paseto: []
  /admin/impact:
    get:
      tags:
      - administration
      operationId: impact
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/overview:
    get:
      tags:
      - administration
      operationId: overview
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/records:
    get:
      tags:
      - administration
      operationId: records
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /connector/connection:
    get:
      tags: []
      summary: Completion needs the editor's secret, not the public approval challenge.
      operationId: connection
      responses:
        '200':
          description: Approved file and host for this scoped credential
          content:
            application/json:
              schema: {}
        '401':
          description: Not approved, expired or revoked
      security:
      - connector_key: []
  /connector/documents/{id}/bundles:
    post:
      tags: []
      operationId: connector_push
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Scoped proposal; canonical history unchanged
          content:
            application/json:
              schema: {}
      security:
      - connector_key: []
  /connector/documents/{id}/checkpoint:
    get:
      tags: []
      operationId: connector_checkpoint
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: through_seq
        in: query
        description: Historical canonical revision; omitted means current head
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: File-scoped credential checkpoint
          content:
            application/json:
              schema: {}
        '400':
          description: Revision outside history
      security:
      - connector_key: []
  /copies/{match_id}:
    post:
      tags:
      - copies
      summary: The owner answers a detected copy.
      operationId: respond
      parameters:
      - name: match_id
        in: path
        description: Detected copy
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {}
        '403':
          description: The owner or a manager of the original document
      security:
      - paseto: []
  /documents:
    get:
      tags:
      - documents
      summary: List accessible (non-archived) documents, cursor-paginated. `[document member]`.
      operationId: list_documents
      parameters:
      - name: status
        in: query
        description: Filter by lifecycle status
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: Opaque pagination cursor
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size (1..=1000)
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: A page of documents, `{ items, next_cursor }`
          content:
            application/json:
              schema: {}
    post:
      tags:
      - documents
      summary: Create a new document; the creator becomes its `Author`. `[Sponsor/creator]`.
      operationId: create_document
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
        required: true
      responses:
        '200':
          description: The created document
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid body
      security:
      - bearer: []
  /documents/{id}:
    get:
      tags:
      - documents
      summary: Document metadata + current materialized state. `[document member]`.
      operationId: get_document
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Document detail (metadata + materialized state)
          content:
            application/json:
              schema: {}
        '404':
          description: No such document
  /documents/{id}/access:
    get:
      tags:
      - product
      operationId: document_access
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /documents/{id}/batch:
    post:
      tags:
      - workspace
      operationId: batch
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
  /documents/{id}/change-requests:
    get:
      tags:
      - reviews
      summary: Submitted change requests are visible to every member; unsubmitted drafts stay private.
      operationId: list
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Open and recently closed change requests
          content:
            application/json:
              schema: {}
        '403':
          description: Document membership required
    post:
      tags:
      - reviews
      summary: Create a draft from an earlier revision plus the pushed file's changes, atomically.
      operationId: create
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Draft created and optionally submitted for review
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid starting revision or changes
        '403':
          description: Viewers cannot propose changes
  /documents/{id}/change-requests/{draft_id}:
    get:
      tags:
      - reviews
      summary: The request, the contributor's own changes and what merging would change now.
      operationId: detail
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Change request identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Review comparison against the current team version
          content:
            application/json:
              schema: {}
        '403':
          description: Document membership required
        '404':
          description: Not submitted or not visible
  /documents/{id}/change-requests/{draft_id}/decline:
    post:
      tags:
      - reviews
      operationId: decline
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Change request identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Declined; the contributor keeps their draft
          content:
            application/json:
              schema: {}
        '403':
          description: Editors decline change requests
  /documents/{id}/change-requests/{draft_id}/merge:
    post:
      tags:
      - reviews
      summary: An editor merges selected changes. Unselected changes stay open in the request.
      operationId: merge
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Change request identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Selected changes appended to the team version
          content:
            application/json:
              schema: {}
        '403':
          description: Editors merge change requests
        '409':
          description: Resolve overlaps or review newer changes first
  /documents/{id}/change-requests/{draft_id}/reviews:
    post:
      tags:
      - reviews
      summary: |-
        Approve, request changes or comment. Reviewers and above approve or request
        changes on other people's requests; any contributor can comment.
      operationId: review
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Change request identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Review recorded
          content:
            application/json:
              schema: {}
        '403':
          description: Role cannot give this review
        '409':
          description: The request is closed
  /documents/{id}/conflicts:
    get:
      tags:
      - conflicts
      summary: List the live four-card conflicts for a document. `[auth]`.
      operationId: list_conflicts
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'Live conflicts, `{ items: [ConflictView...] }`'
          content:
            application/json:
              schema: {}
        '404':
          description: No such document
      security:
      - bearer: []
  /documents/{id}/conflicts/{conflict_id}/resolve:
    post:
      tags:
      - conflicts
      summary: Resolve one conflict. `[Author]`.
      operationId: resolve
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      - name: conflict_id
        in: path
        description: Opaque conflict id from GET /conflicts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
        required: true
      responses:
        '200':
          description: 'The appended canonical events, `{ events: [...] }`'
          content:
            application/json:
              schema: {}
        '400':
          description: Neither/both decision fields set, or an unknown suggestion id
        '403':
          description: Not the document author
        '404':
          description: No such document or live conflict
      security:
      - bearer: []
  /documents/{id}/connectors:
    get:
      tags: []
      operationId: grants
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Caller connections; no credentials
          content:
            application/json:
              schema: {}
      security:
      - paseto: []
    post:
      tags: []
      operationId: grant
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantInput'
        required: true
      responses:
        '200':
          description: Seven-day file-scoped credential; pairing approval returns no secret
          content:
            application/json:
              schema: {}
      security:
      - paseto: []
  /documents/{id}/connectors/{grant}/revoke:
    post:
      tags: []
      operationId: revoke
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: grant
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Own connection revoked
          content:
            application/json:
              schema: {}
      security:
      - paseto: []
  /documents/{id}/copies:
    get:
      tags:
      - copies
      summary: |-
        Copies of this document found elsewhere, and documents this one resembles that
        the viewer can open. Editors and above see them; the owner and managers act on them.
      operationId: copies
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Detected copies and similar documents
          content:
            application/json:
              schema: {}
        '403':
          description: Editors and above
      security:
      - paseto: []
  /documents/{id}/deploy:
    post:
      tags:
      - operations
      summary: |-
        Mark a deployed checkpoint (runs the referential-integrity gate, pins a snapshot).
        `[Sponsor]`.
      operationId: deploy
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The Deployed event
          content:
            application/json:
              schema: {}
        '409':
          description: 'Deploy refused: referential-integrity violations'
      security:
      - bearer: []
  /documents/{id}/discussions:
    get:
      tags:
      - discussions
      operationId: list
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /documents/{id}/discussions/{thread}:
    post:
      tags:
      - discussions
      operationId: change
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      - name: thread
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /documents/{id}/drafts:
    get:
      tags:
      - workspace
      operationId: drafts
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
    post:
      tags:
      - workspace
      operationId: create_draft
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
  /documents/{id}/drafts/{draft_id}:
    get:
      tags:
      - workspace
      operationId: get_draft
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
    post:
      tags:
      - workspace
      operationId: edit_draft
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
  /documents/{id}/drafts/{draft_id}/submit:
    post:
      tags:
      - reviews
      summary: Ask the document's editors to review an existing personal draft.
      operationId: submit
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Draft identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Submitted for review
          content:
            application/json:
              schema: {}
        '403':
          description: Viewers cannot propose changes
        '404':
          description: Not your open draft
  /documents/{id}/drafts/{draft_id}/sync:
    post:
      tags:
      - workspace
      operationId: sync_draft
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Preview, pull, rebase (optionally dropping draft changes) or share a personal draft
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
  /documents/{id}/drafts/{draft_id}/withdraw:
    post:
      tags:
      - reviews
      operationId: withdraw
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Draft identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: The contributor withdrew their request
          content:
            application/json:
              schema: {}
        '403':
          description: Only the contributor can withdraw
  /documents/{id}/events:
    get:
      tags:
      - documents
      summary: |-
        Raw, cursor-paginated event log for a document. `[auth]` — the audit stream is for
        authenticated participants, not the public read path.
      operationId: list_events
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      - name: from_seq
        in: query
        description: Lowest seq to return
        required: false
        schema:
          type: integer
          format: int64
      - name: to_seq
        in: query
        description: Highest seq to return
        required: false
        schema:
          type: integer
          format: int64
      - name: cursor
        in: query
        description: Opaque pagination cursor
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size (1..=1000)
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: A page of events, `{ items, next_cursor }`
          content:
            application/json:
              schema: {}
      security:
      - bearer: []
  /documents/{id}/history-points:
    get:
      tags:
      - reviews
      summary: |-
        Revisions a pushed file may have started from: the latest team version, the first
        saved state (normally the original upload) and named versions.
      operationId: history_points
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Latest, initial and named-version revisions
          content:
            application/json:
              schema: {}
        '403':
          description: Document membership required
  /documents/{id}/history-recovery:
    post:
      tags:
      - reviews
      operationId: recover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
