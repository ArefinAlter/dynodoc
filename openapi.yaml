openapi: 3.1.0
info:
  title: dynodoc engine API
  description: Document version control, collaborative review and authorized administration. Canonical content history is append-only except explicit audited whole-document erasure.
  version: 0.1.0
paths:
  /.well-known/dynodoc-agent:
    get:
      tags:
      - agent
      operationId: agent_discovery
      responses:
        '200':
          description: Protocol ids, formats, limits and capabilities of this server. No authentication; carries no project or user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDiscovery'
  /admin/actions:
    post:
      tags:
      - administration
      operationId: action
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/control:
    post:
      tags:
      - administration
      operationId: control
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/erase:
    post:
      tags:
      - administration
      operationId: erase
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/erase-batch:
    post:
      tags:
      - administration
      summary: |-
        Permanently delete up to 100 documents, each in its own audited transaction with
        its own receipt. One failure does not stop the others.
      operationId: erase_batch
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Per-document results
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
      security:
      - paseto: []
  /admin/impact:
    get:
      tags:
      - administration
      operationId: impact
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/overview:
    get:
      tags:
      - administration
      operationId: overview
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /admin/records:
    get:
      tags:
      - administration
      operationId: records
      parameters:
      - name: kind
        in: query
        description: users, documents, spaces, projects, audit or erasures
        required: true
        schema:
          type: string
      - name: q
        in: query
        description: Case-insensitive substring search, up to 200 characters
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: Rows to skip, 50 per page
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        description: 'Documents only: active or trash'
        required: false
        schema:
          type: string
      - name: actor
        in: query
        description: 'Audit only: account id or part of the actor email'
        required: false
        schema:
          type: string
      - name: since
        in: query
        description: 'Audit only: RFC 3339 time or YYYY-MM-DD, inclusive'
        required: false
        schema:
          type: string
      - name: until
        in: query
        description: 'Audit only: RFC 3339 time (exclusive) or YYYY-MM-DD, through that day'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /auth/app-handover:
    post:
      tags:
      - auth
      summary: |-
        Make a one-time hand-over code for the signed-in account. `[web server only: service key
        and the person's own account token]`. The code is bound to the PKCE challenge and the
        state, valid for 60 seconds, usable once; an account holds at most three unused codes.
      operationId: app_handover_issue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
        required: true
      responses:
        '200':
          description: A code, valid for 60 seconds, usable once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResponse'
        '400':
          description: Challenge, state or platform malformed
        '401':
          description: No valid account token
        '403':
          description: Not the trusted web server
        '429':
          description: The account already holds three unused codes
      security:
      - paseto: []
  /auth/app-handover/redeem:
    post:
      tags:
      - auth
      summary: |-
        Trade a hand-over code and its PKCE verifier for a session, exactly as a magic-link
        sign-in makes one. `[web server only: service key]`; the app's own credentials are the
        code and the verifier, so no account token is read. Every refusal is the same `401`.
      operationId: app_handover_redeem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemRequest'
        required: true
      responses:
        '200':
          description: A new login for the account that issued the code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refused; the same answer for every reason, a malformed code included
        '403':
          description: Not the trusted web server
        '429':
          description: Too many failed attempts from this address or for this code prefix
  /auth/logout:
    post:
      tags:
      - auth::routes
      summary: |-
        Revoke the login identified by a refresh secret, including rotated ancestors.
        Invalid/already revoked credentials have the same idempotent response.
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Login revoked; legacy sessions revoke the account generation
          content:
            application/json:
              schema: {}
  /connector/connection:
    get:
      tags: []
      summary: Completion needs the editor's secret, not the public approval challenge.
      operationId: connection
      responses:
        '200':
          description: Approved file and host for this scoped credential
          content:
            application/json:
              schema: {}
        '401':
          description: Not approved, expired or revoked
      security:
      - connector_key: []
  /connector/documents/{id}/bundles:
    post:
      tags: []
      operationId: connector_push
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Scoped proposal; canonical history unchanged
          content:
            application/json:
              schema: {}
      security:
      - connector_key: []
  /connector/documents/{id}/checkpoint:
    get:
      tags: []
      operationId: connector_checkpoint
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: through_seq
        in: query
        description: Historical canonical revision; omitted means current head
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: File-scoped credential checkpoint
          content:
            application/json:
              schema: {}
        '400':
          description: Revision outside history
      security:
      - connector_key: []
  /copies/{match_id}:
    post:
      tags:
      - copies
      summary: The owner answers a detected copy.
      operationId: respond
      parameters:
      - name: match_id
        in: path
        description: Detected copy
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {}
        '403':
          description: The owner or a manager of the original document
      security:
      - paseto: []
  /devices:
    get:
      tags:
      - devices
      operationId: list
      responses:
        '200':
          description: Own public signing keys, at most 128, each with its project_access mode (granted or all), class (person or agent) and optional label, and active per-project grants (at most 50, scopes, current role); never a directory of other members
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
      security:
      - paseto: []
    post:
      tags:
      - devices
      operationId: register
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: 'Enrolled device or exact active retry. Body: the signed challenge and signature, plus optional project_access (granted by default; all is the account-wide mode), class (person or agent; an agent key can only hold content:read grants and a person''s key never can) and label (a display name, at most 80 characters). Returns id, public_key, the key''s project_access and class'
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid proof, project_access, class or label
        '401':
          description: Sign in required
        '403':
          description: Wrong account
        '409':
          description: Challenge expired, used, key revoked or limit reached
      security:
      - paseto: []
  /devices/challenge:
    post:
      tags:
      - devices
      operationId: challenge
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Five-minute account and installation bound enrollment challenge
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid key
        '401':
          description: Sign in required
        '409':
          description: Key unavailable or device limit
        '429':
          description: Too many enrollment attempts
      security:
      - paseto: []
  /devices/verify-commit:
    post:
      tags:
      - devices
      operationId: verify_commit
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Signature matches an active key of this account; does not publish, store or authorize project changes
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid signed commit
        '401':
          description: Sign in required
        '403':
          description: Key is not active for this account
      security:
      - paseto: []
  /devices/{id}/revoke:
    post:
      tags:
      - devices
      operationId: revoke
      parameters:
      - name: id
        in: path
        description: Own device ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Permanently revoked, idempotent
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '404':
          description: No such own device
      security:
      - paseto: []
  /devices/{key_id}:
    patch:
      tags:
      - devices
      operationId: device_access_set
      parameters:
      - name: key_id
        in: path
        description: Own device key
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequest'
        required: true
      responses:
        '200':
          description: The key's mode; changed is false when it already had this mode. Existing grants are kept
          content:
            application/json:
              schema: {}
        '400':
          description: Unknown mode, or all without confirm_all_projects
        '401':
          description: Account sign-in required; a device token is refused
        '404':
          description: No such own key
        '409':
          description: Key revoked
      security:
      - paseto: []
  /devices/{key_id}/projects/{project_id}:
    put:
      tags:
      - devices
      operationId: device_grant_set
      parameters:
      - name: key_id
        in: path
        description: Own device key
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        description: Project the account is a member of
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
        required: true
      responses:
        '200':
          description: The key's active grant for this project (idempotent); changed is false when the scopes were already these
          content:
            application/json:
              schema: {}
        '400':
          description: Empty or unknown scopes, a scope that does not match the key's class, or content:propose or content:submit without content:read
        '401':
          description: Account sign-in required; a device token is refused
        '403':
          description: Not a current member of the project
        '404':
          description: No such own key
        '409':
          description: Key revoked or 50 active grants reached
      security:
      - paseto: []
    delete:
      tags:
      - devices
      operationId: device_grant_revoke
      parameters:
      - name: key_id
        in: path
        description: Own device key
        required: true
        schema:
          type: string
          format: uuid
      - name: project_id
        in: path
        description: Project
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The active grant is revoked; applies to the key's next request. changed is false when there was none
          content:
            application/json:
              schema: {}
        '401':
          description: Account sign-in required; a device token is refused
        '404':
          description: No such own key
      security:
      - paseto: []
  /documents:
    get:
      tags:
      - documents
      summary: List accessible (non-archived) documents, cursor-paginated. `[document member]`.
      operationId: list_documents
      parameters:
      - name: status
        in: query
        description: Filter by lifecycle status
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: Opaque pagination cursor
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size (1..=1000)
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: A page of documents, `{ items, next_cursor }`
          content:
            application/json:
              schema: {}
    post:
      tags:
      - documents
      summary: Create a new document; the creator becomes its `Author`. `[Sponsor/creator]`.
      operationId: create_document
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
        required: true
      responses:
        '200':
          description: The created document
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid body
      security:
      - bearer: []
  /documents/{id}:
    get:
      tags:
      - documents
      summary: Document metadata + current materialized state. `[document member]`.
      operationId: get_document
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Document detail (metadata + materialized state)
          content:
            application/json:
              schema: {}
        '404':
          description: No such document
  /documents/{id}/access:
    get:
      tags:
      - product
      operationId: document_access
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: {}
        '400':
          description: Validation or confirmation failed
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Refresh the current revision
      security:
      - paseto: []
  /documents/{id}/agent-policy:
    put:
      tags:
      - agent policy
      operationId: agent_file_policy_put
      parameters:
      - name: id
        in: path
        description: File
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilePolicyBody'
        required: true
      responses:
        '200':
          description: The file's agent access. none hides the file from agents entirely (404 on every agent route, absent from the listing and the 8-character lookup) and purges its cached state. A file override can only narrow the project policy. Audited (agent.file_policy.changed) when it changes. Needs the file's owner or a project manager; loosening it (none to read or inherit, read to inherit) needs a project owner or manager, so a file's creator who is only an editor or viewer can tighten but not undo a manager's choice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePolicyView'
        '400':
          description: access is not inherit, none or read
        '401':
          description: Account sign-in required; a device, agent or connector token is refused
        '403':
          description: The caller can open the file but is neither its owner nor a manager, or is loosening an override without being a project owner or manager
        '404':
          description: No such file, or not one the caller can open, or not in a project
        '429':
          description: The caller's management budget (120 a minute, 2 at once) is used up
      security:
      - paseto: []
  /documents/{id}/batch:
    post:
      tags:
      - workspace
      operationId: batch
      parameters:
      - name: id
        in: path
        description: Resource identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Success; requires document membership
          content:
            application/json:
              schema: {}
        '401':
          description: Sign in required
        '403':
          description: Insufficient access
        '409':
          description: Review a concurrent change before retrying
  /documents/{id}/change-requests:
    get:
      tags:
      - reviews
      summary: Submitted change requests are visible to every member; unsubmitted drafts stay private.
      operationId: list
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Open and recently closed change requests
          content:
            application/json:
              schema: {}
        '403':
          description: Document membership required
    post:
      tags:
      - reviews
      summary: Create a draft from an earlier revision plus the pushed file's changes, atomically.
      operationId: create
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Draft created and optionally submitted for review
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid starting revision or changes
        '403':
          description: Viewers cannot propose changes
  /documents/{id}/change-requests/{draft_id}:
    get:
      tags:
      - reviews
      summary: The request, the contributor's own changes and what merging would change now.
      operationId: detail
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Change request identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Review comparison against the current team version
          content:
            application/json:
              schema: {}
        '403':
          description: Document membership required
        '404':
          description: Not submitted or not visible
  /documents/{id}/change-requests/{draft_id}/decline:
    post:
      tags:
      - reviews
      operationId: decline
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Change request identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Declined; the contributor keeps their draft
          content:
            application/json:
              schema: {}
        '403':
          description: Editors decline change requests
  /documents/{id}/change-requests/{draft_id}/merge:
    post:
      tags:
      - reviews
      summary: An editor merges selected changes. Unselected changes stay open in the request.
      operationId: merge
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Change request identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema: {}
        required: true
      responses:
        '200':
          description: Selected changes appended to the team version
          content:
            application/json:
              schema: {}
        '403':
          description: Editors merge change requests
        '409':
          description: Resolve overlaps or review newer changes first
  /documents/{id}/change-requests/{draft_id}/reviews:
    post:
      tags:
      - reviews
      summary: |-
        Approve, request changes or comment. Reviewers and above approve or request
        changes on other people's requests; any contributor can comment. An approval or a
        request for changes names the revision of the request it was given for (`revision`), and
        counts only while the request's content is as it was at that revision.
      operationId: review
      parameters:
      - name: id
        in: path
        description: Document identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: draft_id
        in: path
        description: Change request identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      responses:
        '200':
          description: Review recorded
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid review; code revision_required when an approval or a request for changes names no revision
        '403':
          description: Role cannot give this review
        '409':
          description: The request is closed (code conflict), or it changed after the revision the review names (code request_changed, details.current_revision)
  /documents/{id}/conflicts:
    get:
      tags:
      - conflicts
      summary: List the live four-card conflicts for a document. `[auth]`.
      operationId: list_conflicts
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'Live conflicts, `{ items: [ConflictView...] }`'
          content:
            application/json:
              schema: {}
        '404':
          description: No such document
      security:
      - bearer: []
  /documents/{id}/conflicts/{conflict_id}/resolve:
    post:
      tags:
      - conflicts
      summary: Resolve one conflict. `[Author]`.
      operationId: resolve
      parameters:
      - name: id
        in: path
        description: Document id
        required: true
        schema:
          type: string
          format: uuid
      - name: conflict_id
        in: path
        description: Opaque conflict id from GET /conflicts
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
        required: true
      responses:
        '200':
          description: 'The appended canonical events, `{ events: [...] }`'
          content:
            application/json:
