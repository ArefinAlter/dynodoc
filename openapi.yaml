          description: Up to 20,000 characters.
        labels:
          type: array
          items:
            type: string
            format: uuid
          description: Up to 20 labels of this project.
        title:
          type: string
          description: 1-200 characters, one line.
      additionalProperties: false
    NewLabel:
      type: object
      required:
      - name
      - color
      properties:
        color:
          type: string
          description: Six hexadecimal digits; a leading `#` is accepted.
        description:
          type: string
          description: Up to 200 characters.
        name:
          type: string
          description: 1-50 characters, unique in the project ignoring case.
      additionalProperties: false
    NodeCreateRequest:
      type: object
      description: '`POST /ops/node-create`. `node_id` is optional; absent, the server mints a ULID.'
      required:
      - node_type
      - pos
      properties:
        fields: {}
        node_id:
          type:
          - string
          - 'null'
        node_type:
          type: string
        parent_id:
          type:
          - string
          - 'null'
        pos:
          type: string
        var_name:
          type:
          - string
          - 'null'
    PolicyBody:
      type: object
      description: |-
        The new policy. `enabled` must be said; every other field left out keeps its SAVED value
        (the defaults when nothing was saved), so a request that only flips `enabled` cannot
        silently widen the role floor, the kinds or the budgets.
      required:
      - enabled
      properties:
        calls_per_minute:
          type:
          - integer
          - 'null'
          format: int64
          description: 1 to 600 (default 60).
        enabled:
          type: boolean
          description: Master switch. Required.
        kinds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'One or more of `document`, `spreadsheet`, `presentation` (default: all three).'
        min_role:
          type:
          - string
          - 'null'
          description: '`viewer` (default), `contributor`, `reviewer`, `editor`, `manager` or `owner`.'
        open_proposals:
          type:
          - integer
          - 'null'
          format: int64
          description: 0 to 100 (default 5).
        ops_per_proposal:
          type:
          - integer
          - 'null'
          format: int64
          description: 1 to 10,000 (default 500).
        proposals_per_day:
          type:
          - integer
          - 'null'
          format: int64
          description: 0 to 1000 (default 20).
        read_bytes_per_day:
          type:
          - integer
          - 'null'
          format: int64
          description: 10,000 to 1,000,000,000 (default 20,000,000).
        submit_requires_person:
          type:
          - boolean
          - 'null'
          description: Default true.
        write_mode:
          type:
          - string
          - 'null'
          description: '`none` (default), `draft` or `change_request`.'
      additionalProperties: false
    PolicyView:
      type: object
      description: The project's agent policy as saved, or the defaults when none was ever saved.
      required:
      - project_id
      - configured
      - enabled
      - min_role
      - kinds
      - calls_per_minute
      - read_bytes_per_day
      - write_mode
      - submit_requires_person
      - proposals_per_day
      - open_proposals
      - ops_per_proposal
      - revision
      - gateway
      - file_overrides
      - file_overrides_truncated
      properties:
        calls_per_minute:
          type: integer
          format: int32
          description: Reads per minute for each agent grant (1 to 600). Default 60.
        changed:
          type:
          - boolean
          - 'null'
          description: 'On `PUT`: false when the body equalled the saved policy and nothing was written.'
        configured:
          type: boolean
          description: |-
            False until an owner or manager first saves a policy. A project with no saved
            policy has agents disabled.
        enabled:
          type: boolean
          description: Master switch. Default false.
        file_overrides:
          type: array
          items:
            $ref: '#/components/schemas/FileOverride'
          description: Files with a policy of `none` or `read`, newest first, at most 100.
        file_overrides_truncated:
          type: boolean
        gateway:
          type: boolean
          description: |-
            Whether this server serves the agent routes at all (`AGENT_GATEWAY=on`). The
            policy can be saved either way; it has no effect while this is false.
        killed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            When the kill switch was last pulled (null if never). Agent sessions issued before
            it are refused, whatever is granted or enabled afterwards.
        kinds:
          type: array
          items:
            type: string
          description: 'File kinds agents may read: any of `document`, `spreadsheet`, `presentation`.'
        min_role:
          type: string
          description: |-
            Lowest project role whose agents may read: `viewer`, `contributor`, `reviewer`,
            `editor`, `manager` or `owner`. Default `viewer` (every member).
        open_proposals:
          type: integer
          format: int32
          description: Proposals one agent identity may have open at once (0 to 100). Default 5.
        ops_per_proposal:
          type: integer
          format: int32
          description: Engine operations in one proposal (1 to 10,000). Default 500.
        project_id:
          type: string
          format: uuid
        proposals_per_day:
          type: integer
          format: int32
          description: Proposals one agent identity may open per UTC day (0 to 1000). Default 20.
        read_bytes_per_day:
          type: integer
          format: int64
          description: |-
            Response bytes per UTC day for each agent grant (10,000 to 1,000,000,000).
            Default 20,000,000.
        revision:
          type: integer
          format: int64
          description: |-
            Zero until the first save; then increases by one with every change. Send it back
            in `If-Match`.
        submit_requires_person:
          type: boolean
          description: A person must submit an agent's draft even in `change_request` mode. Default true.
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        write_mode:
          type: string
          description: |-
            What agents may write: `none` (the default: they only read), `draft` (they stage
            drafts that a person submits) or `change_request` (they may submit, unless
            `submit_requires_person`). The kill switch sets it back to `none`.
    RecoveryRequest:
      type: object
      required:
      - through_seq
      properties:
        action:
          $ref: '#/components/schemas/Action'
          description: Preview by default. Create makes a private draft, never a canonical edit.
        base_seq:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Required on create: the team revision returned by preview.'
        from_seq:
          type:
          - integer
          - 'null'
          format: int64
          description: Range start (exclusive), required for revert/cherry-pick. End is through_seq.
        mode:
          $ref: '#/components/schemas/Mode'
          description: Restore content, reverse a revision range, or apply that range again.
        node_ids:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Omit for all content; otherwise select 1-5000 unique logical block IDs.
        request_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Required on create. Keep the same UUID and request on a retry.
        resolutions:
          type: object
          description: 'Explicit overlap choices returned by preview: conflict key -> team or draft.'
          additionalProperties:
            type: string
          propertyNames:
            type: string
        through_seq:
          type: integer
          format: int64
          description: Exact retained event revision, including zero for the empty initial state.
      additionalProperties: false
    RedeemRequest:
      type: object
      required:
      - code
      - state
      - verifier
      properties:
        client:
          type:
          - string
          - 'null'
          description: |-
            The visitor's network address as the web server sees it, when that tells visitors
            apart (behind a proxy that hides it, the web server leaves it out). Only its hash is
            kept, in a rate window.
        code:
          type: string
          description: The code from the browser, 64 lower-case hexadecimal digits.
        state:
          type: string
          description: The state the app sent when it started and received back with the code.
        verifier:
          type: string
          description: The app's PKCE verifier, 43 to 128 characters of `A-Za-z0-9-._~`.
      additionalProperties: false
    RefreshRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    RejectRequest:
      type: object
      description: '`POST /proposals/:event_id/reject`.'
      properties:
        reason:
          type:
          - string
          - 'null'
    ResolveRequest:
      type: object
      description: '`POST .../resolve` body. Exactly one of the two fields must be set.'
      properties:
        accept_suggestion_id:
          type:
          - string
          - 'null'
          description: Accept this competing proposal's value as canonical.
        custom_value:
          description: Override all proposals with this custom value.
    ReviewRequest:
      type: object
      required:
      - verdict
      properties:
        node_id:
          type:
          - string
          - 'null'
          description: Comment on one changed block.
        note:
          type: string
        revision:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The `revision` of the change request the reviewer was looking at (the one its detail
            returned). **Required for `approved` and `changes_requested`**: the review is given for
            that revision and for no other. If the request has moved since, the answer is `409`
            with the code `request_changed`; read the request again. A comment may leave it out.
        verdict:
          type: string
          description: '`approved`, `changes_requested` or `commented`.'
    SessionAnswer:
      type: object
      required:
      - challenge
      - mac
      - signature
      properties:
        challenge:
          type: object
          description: The challenge exactly as issued.
        mac:
          type: string
        signature:
          type: string
          description: |-
            Ed25519 signature (128 hex characters) over `dynodoc.device-session\0v1\0`
            followed by the canonical JSON of the challenge.
    StarState:
      type: object
      required:
      - starred
      - star_count
      properties:
        star_count:
          type: integer
          format: int64
        starred:
          type: boolean
    SubmitRequest:
      type: object
      properties:
        note:
          type: string
        revision:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            The `revision` of the draft the person was looking at. **Required to adopt a draft an
            AI agent wrote** (an agent can add to its own draft until it is submitted, so the
            person must send what they read); when given for a draft of the person's own it must
            match as well. A draft that moved is `409` with the code `request_changed`.
    SuggestRequest:
      type: object
      description: '`POST /ops/suggest`. `detail` is the wrapped content op (internally-tagged JSON).'
      required:
      - detail
      properties:
        detail: {}
        suggestion_id:
          type:
          - string
          - 'null'
        target_node_id:
          type:
          - string
          - 'null'
    TokenResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
          description: Access-token lifetime in seconds.
        refresh_token:
          type: string
          description: Opaque refresh token (rotates on every use).
        token_type:
          type: string
    UsageRow:
      type: object
      description: One day of one client claim.
      required:
      - day
      - calls
      - bytes_out
      - denials
      - errors
      properties:
        bytes_out:
          type: integer
          format: int64
        calls:
          type: integer
          format: int64
        client:
          type:
          - string
          - 'null'
          description: |-
            The caller's own `X-Dynodoc-Client` claim (null when it sent none). Untrusted
            text; never used for authorisation.
        day:
          type: string
          format: date
          description: UTC calendar day.
        denials:
          type: integer
          format: int64
          description: |-
            Calls the policy or a grant check refused (`forbidden`, `policy_denied`,
            `budget_exceeded`).
        errors:
          type: integer
          format: int64
          description: Calls that failed for another reason (bad request, replay failure and so on).
    UsageView:
      type: object
      required:
      - project_id
      - from
      - to
      - items
      - truncated
      properties:
        from:
          type: string
          format: date
        items:
          type: array
          items:
            $ref: '#/components/schemas/UsageRow'
          description: Newest day first, then most calls; at most 500.
        project_id:
          type: string
          format: uuid
        to:
          type: string
          format: date
        truncated:
          type: boolean
  securitySchemes:
    connector_key:
      type: http
      scheme: bearer
      bearerFormat: 64 hexadecimal characters; file-scoped editor key
    device_session:
      type: http
      scheme: bearer
      bearerFormat: PASETO v4.local project device session; one project, 1 hour
    paseto:
      type: http
      scheme: bearer
      bearerFormat: PASETO v4.local
tags:
- name: documents
  description: Document read + create
- name: operations
  description: The write path (governance-gated)
- name: conflicts
  description: Four-card conflict resolution
- name: audit
  description: Member-only hash-chain audit endpoints
