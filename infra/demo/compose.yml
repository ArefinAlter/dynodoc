name: dynodoc-demo
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dynodoc
      POSTGRES_DB: dynodoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [engine]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dynodoc -d dynodoc']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ../..
      dockerfile: infra/demo/Dockerfile.api
    restart: unless-stopped
    environment:
      PASETO_LOCAL_KEY: ${PASETO_LOCAL_KEY:?Set PASETO_LOCAL_KEY}
      WEB_SERVICE_KEY: ${WEB_SERVICE_KEY:?Set WEB_SERVICE_KEY}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-3600}
      PUBLIC_API_BASE_URL: ${ORIGIN}
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?Set RUNTIME_DATABASE_URL to the restricted runtime login}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      APP_ENV: production
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      RUST_LOG: info
      # The retention jobs (expired sign-in rows, old page metrics) are built in but stay OFF on this
      # installation until the owner has looked at what the first pass would remove (set
      # RETENTION_JOBS=on in .env to enable them). The API's own default is on.
      RETENTION_JOBS: ${RETENTION_JOBS:-off}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [engine]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
  database-admin:
    profiles: [maintenance]
    build:
      context: ../..
      dockerfile: infra/demo/Dockerfile.api
    entrypoint: [engine-cli]
    command: [migrate]
    environment:
      MIGRATION_DATABASE_URL: postgres://dynodoc:${POSTGRES_PASSWORD}@postgres:5432/dynodoc
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?Set RUNTIME_DATABASE_URL to the restricted runtime login}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [engine]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
  web:
    build:
      context: ../..
      dockerfile: infra/demo/Dockerfile.web
    restart: unless-stopped
    environment:
      ORIGIN: ${ORIGIN:?Set ORIGIN}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      WEB_SERVICE_KEY: ${WEB_SERVICE_KEY:?Set WEB_SERVICE_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CONVERTER_KEY: ${CONVERTER_KEY:?Set CONVERTER_KEY}
      CONNECTOR_ORIGINS: ${CONNECTOR_ORIGINS:-}
      ENGINE_API_URL: http://api:8080
      CONVERTER_URL: http://converter:8090
      DEV_AUTH: 'false'
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    ports: ['127.0.0.1:3088:3000']
    networks: [engine, conversion, web]
    depends_on: [api]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
  admin:
    build:
      context: ../..
      dockerfile: infra/demo/Dockerfile.web
    restart: unless-stopped
    environment:
      ORIGIN: https://admin.dynodoc.online
      ADMIN_SITE: 'true'
      PUBLIC_WORKSPACE_URL: https://app.dynodoc.online
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      WEB_SERVICE_KEY: ${WEB_SERVICE_KEY:?Set WEB_SERVICE_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ENGINE_API_URL: http://api:8080
      OPS_STATUS_PATH: /app/ops/status.json
      DEV_AUTH: 'false'
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    ports: ['127.0.0.1:3089:3000']
    volumes: ['../../ops:/app/ops:ro']
    networks: [engine, web]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m]
  converter:
    build:
      context: ../..
      dockerfile: infra/converter/Dockerfile
    restart: unless-stopped
    environment:
      CONVERTER_KEY: ${CONVERTER_KEY:?Set CONVERTER_KEY}
    networks: [conversion]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=256m]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
networks:
  engine:
    internal: true
  conversion:
    internal: true
  web: {}
volumes:
  database: {}
