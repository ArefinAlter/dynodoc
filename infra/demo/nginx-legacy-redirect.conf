# Retain the temporary host for existing links and certificate renewal.
server {
    listen 80;
    server_name dynodoc.103.191.50.32.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/dynodoc-acme; }
    location / { return 308 https://app.dynodoc.online$request_uri; }
}

server {
    listen 443 ssl;
    server_name dynodoc.103.191.50.32.sslip.io;
    ssl_certificate /etc/letsencrypt/live/dynodoc.103.191.50.32.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dynodoc.103.191.50.32.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://app.dynodoc.online$request_uri;
}
