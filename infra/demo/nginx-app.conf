# Install after app.dynodoc.online resolves to the VPS and its certificate exists.
# This is a separate virtual host; preserve all other applications' server blocks.
limit_req_zone $binary_remote_addr zone=dynodoc_app_auth:10m rate=60r/m;
# Avoid recording OAuth codes and email sign-in tokens in the access log.
limit_req_zone $binary_remote_addr zone=dynodoc_metrics:10m rate=120r/m;
log_format dynodoc_app_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name app.dynodoc.online;
    location /.well-known/acme-challenge/ { root /var/www/dynodoc-acme; }
    location / { return 301 https://app.dynodoc.online$request_uri; }
}

server {
    listen 443 ssl;
    server_name app.dynodoc.online;
    ssl_certificate /etc/letsencrypt/live/app.dynodoc.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.dynodoc.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    access_log /var/log/nginx/dynodoc-app.access.log dynodoc_app_safe;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /telemetry {
        client_max_body_size 2k;
        limit_req zone=dynodoc_metrics burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/ {
        limit_req zone=dynodoc_app_auth burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://127.0.0.1:3088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
