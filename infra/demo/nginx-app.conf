# Preserve the application's nonce/hash policy; cover static/proxy errors too.
# Static manifest command frames bypass SvelteKit; scope their policy explicitly.
# The service worker takes the policy of its own script response and fetches only the app's
# own files: under the default below (no connect-src) every fetch it made would be blocked.
# The offline page is rewrapped by the worker; its entry only styles a direct visit.
map $uri $dynodoc_app_fallback_csp {
    /service-worker.js "default-src 'none'; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; form-action 'self'";
    /offline.html "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; form-action 'self'";
    /connectors/commands.html "default-src 'none'; script-src 'self' https://appsforoffice.microsoft.com https://officeapis.public.onecdn.static.microsoft https://ajax.aspnetcdn.com; connect-src 'self' https://appsforoffice.microsoft.com https://officeapis.public.onecdn.static.microsoft https://ajax.aspnetcdn.com; base-uri 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'self' https://*.officeapps.live.com https://*.office.com https://*.office365.com https://*.microsoft365.com https://*.cloud.microsoft https://office.live.com https://onedrive.live.com https://*.sharepoint.com";
    default "default-src 'none'; script-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; form-action 'self'";
}
map $upstream_http_content_security_policy $dynodoc_app_csp {
    "" $dynodoc_app_fallback_csp;
    default $upstream_http_content_security_policy;
}
map $uri $dynodoc_app_frame_options {
    /connectors/commands.html "";
    ~^/connectors/(word|excel|powerpoint)/?$ "";
    # The app sign-in pages are never framed, by anyone (decision 017).
    ~^/app-signin(/finish)?/?$ DENY;
    default SAMEORIGIN;
}
# Install after app.dynodoc.online resolves to the VPS and its certificate exists.
# This is a separate virtual host; preserve all other applications' server blocks.
limit_req_zone $binary_remote_addr zone=dynodoc_app_auth:10m rate=60r/m;
# The sign-in confirmation form is a POST to /app-signin, outside /auth/, so it gets the same
# per-address limit as /auth/ by a zone of its own that counts POSTs only (an empty key is not
# limited, so the page itself and its redirects are never counted).
map $request_method $dynodoc_signin_post_key {
    POST $binary_remote_addr;
    default "";
}
limit_req_zone $dynodoc_signin_post_key zone=dynodoc_app_signin:10m rate=60r/m;
# Avoid recording OAuth codes and email sign-in tokens in the access log.
limit_req_zone $binary_remote_addr zone=dynodoc_metrics:10m rate=120r/m;
# The pre-alpha service (deploy/pre-alpha): its own limits; starting a sample workspace is rarer.
limit_req_zone $binary_remote_addr zone=dynodoc_svc:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=dynodoc_svc_start:10m rate=6r/m;
map $uri $dynodoc_safe_uri {
    ~^/view/ /view/[private-link];
    default $uri;
}
log_format dynodoc_app_safe '$remote_addr - [$time_local] "$request_method $dynodoc_safe_uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name app.dynodoc.online;
    location /.well-known/acme-challenge/ { root /var/www/dynodoc-acme; }
    location / { return 301 https://app.dynodoc.online$request_uri; }
}

server {
    listen 443 ssl;
    server_name app.dynodoc.online;
    ssl_certificate /etc/letsencrypt/live/app.dynodoc.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.dynodoc.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    # Signed-in SvelteKit pages include asset preload Link headers larger than
    # Nginx's default 4 KiB header buffer; include room for session rotation too.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    access_log /var/log/nginx/dynodoc-app.access.log dynodoc_app_safe;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header Content-Security-Policy $dynodoc_app_csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options $dynodoc_app_frame_options always;

    location = /telemetry {
        client_max_body_size 2k;
        limit_req zone=dynodoc_metrics burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # The pre-alpha service answers on a unix socket (no port, no network of its own). It sets its
    # own Content-Security-Policy and X-Robots-Tag; no add_header here, so the ones above apply.
    location = /svc/visitor/start {
        client_max_body_size 4k;
        limit_req zone=dynodoc_svc_start burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/opt/dynodoc-prealpha/run/svc.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /svc/v1/visitor {
        client_max_body_size 4k;
        limit_req zone=dynodoc_svc_start burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/opt/dynodoc-prealpha/run/svc.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ^~ /svc/ {
        client_max_body_size 320k;
        limit_req zone=dynodoc_svc burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/opt/dynodoc-prealpha/run/svc.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /auth/ {
        limit_req zone=dynodoc_app_auth burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /app-signin {
        limit_req zone=dynodoc_app_signin burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://127.0.0.1:3088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
