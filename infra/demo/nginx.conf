# Add as a new named virtual host; do not replace existing server blocks.
server {
    listen 80;
    server_name dynodoc.103.191.50.32.sslip.io;
    client_max_body_size 16m;
    location /.well-known/acme-challenge/ { root /var/www/dynodoc-acme; }
    location / {
        proxy_pass http://127.0.0.1:3088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
