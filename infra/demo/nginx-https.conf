limit_req_zone $binary_remote_addr zone=dynodoc_auth:10m rate=60r/m;
server {
    listen 80;
    server_name dynodoc.103.191.50.32.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/dynodoc-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name dynodoc.103.191.50.32.sslip.io;
    ssl_certificate /etc/letsencrypt/live/dynodoc.103.191.50.32.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dynodoc.103.191.50.32.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location /auth/ {
        limit_req zone=dynodoc_auth burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://127.0.0.1:3088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
