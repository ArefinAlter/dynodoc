# Preserve the application's nonce/hash policy; cover static/proxy errors too.
map $upstream_http_content_security_policy $dynodoc_admin_csp {
    "" "default-src 'none'; script-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; form-action 'self'";
    default $upstream_http_content_security_policy;
}
# Install after admin.dynodoc.online resolves to the VPS and its certificate exists.
# This is a separate virtual host; preserve all other applications' server blocks.
limit_req_zone $binary_remote_addr zone=dynodoc_admin_auth:10m rate=30r/m;
# Avoid recording OAuth codes and email sign-in tokens in the access log.
log_format dynodoc_admin_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name admin.dynodoc.online;
    location /.well-known/acme-challenge/ { root /var/www/dynodoc-acme; }
    location / { return 301 https://admin.dynodoc.online$request_uri; }
}

server {
    listen 443 ssl;
    server_name admin.dynodoc.online;
    ssl_certificate /etc/letsencrypt/live/admin.dynodoc.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.dynodoc.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    # Match the workspace proxy's allowance for asset preloads and auth cookies.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    access_log /var/log/nginx/dynodoc-admin.access.log dynodoc_admin_safe;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header Content-Security-Policy $dynodoc_admin_csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /auth/ {
        limit_req zone=dynodoc_admin_auth burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3089;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://127.0.0.1:3089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
