# Maps and zones shared by every server block of the bundled proxy.
#
# The three content-security-policy and frame-option maps below are the ones the hosted proxy
# uses (infra/demo/nginx-app.conf, the first twenty lines after this header) and are kept
# byte for byte: scripts/smoke.mjs fails if they drift. They are what
# infra/demo/check-connectors.py and frontend/researcher/scripts/check-proxy-headers.mjs test.
#
# BEGIN HOSTED MAPS
# Preserve the application's nonce/hash policy; cover static/proxy errors too.
# Static manifest command frames bypass SvelteKit; scope their policy explicitly.
# The service worker takes the policy of its own script response and fetches only the app's
# own files: under the default below (no connect-src) every fetch it made would be blocked.
# The offline page is rewrapped by the worker; its entry only styles a direct visit.
map $uri $dynodoc_app_fallback_csp {
    /service-worker.js "default-src 'none'; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; form-action 'self'";
    /offline.html "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; form-action 'self'";
    /connectors/commands.html "default-src 'none'; script-src 'self' https://appsforoffice.microsoft.com https://officeapis.public.onecdn.static.microsoft https://ajax.aspnetcdn.com; connect-src 'self' https://appsforoffice.microsoft.com https://officeapis.public.onecdn.static.microsoft https://ajax.aspnetcdn.com; base-uri 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'self' https://*.officeapps.live.com https://*.office.com https://*.office365.com https://*.microsoft365.com https://*.cloud.microsoft https://office.live.com https://onedrive.live.com https://*.sharepoint.com";
    default "default-src 'none'; script-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'self'; form-action 'self'";
}
map $upstream_http_content_security_policy $dynodoc_app_csp {
    "" $dynodoc_app_fallback_csp;
    default $upstream_http_content_security_policy;
}
map $uri $dynodoc_app_frame_options {
    /connectors/commands.html "";
    ~^/connectors/(word|excel|powerpoint)/?$ "";
    # The app sign-in pages are never framed, by anyone (decision 017).
    ~^/app-signin(/finish)?/?$ DENY;
    default SAMEORIGIN;
}
# END HOSTED MAPS

# Rate limits (the hosted values) and a log line that keeps private links and sign-in tokens
# out of the log: /view/<token> is logged as /view/[private-link], and the query string is
# never logged.
limit_req_zone $binary_remote_addr zone=dynodoc_app_auth:10m rate=60r/m;
# The sign-in confirmation form is a POST to /app-signin, outside /auth/, so it gets the same
# per-address limit as /auth/ by a zone of its own that counts POSTs only (an empty key is not
# limited, so the page itself and its redirects are never counted).
map $request_method $dynodoc_signin_post_key {
    POST $binary_remote_addr;
    default "";
}
limit_req_zone $dynodoc_signin_post_key zone=dynodoc_app_signin:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=dynodoc_metrics:10m rate=120r/m;
map $uri $dynodoc_safe_uri {
    ~^/view/ /view/[private-link];
    default $uri;
}
log_format dynodoc_app_safe '$remote_addr - [$time_local] "$request_method $dynodoc_safe_uri $server_protocol" $status $body_bytes_sent';

# WebSocket upgrade pass-through. An ordinary request keeps the empty Connection header the
# server-sent-event stream needs; an upgrade request keeps "upgrade".
map $http_upgrade $dynodoc_connection_header {
    default upgrade;
    '' '';
}
