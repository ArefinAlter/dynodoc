# Main configuration of the Dynodoc bundled proxy (nginx, unprivileged).
#
# Static pieces live in /etc/nginx/dynodoc (read-only image layer). The pieces that depend on the
# settings (host name, TLS mode, certificate paths) are written by proxy-entrypoint into
# /tmp/dynodoc-nginx (tmpfs) at start and again, validated, whenever a certificate changes.
# Two workers are plenty for one installation (the container is limited to one CPU) and keep
# memory predictable; `auto` would start one per host CPU.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/dynodoc/maps.conf;
    include /tmp/dynodoc-nginx/*.conf;
}
