# Dynodoc self-hosted edition, Profile A: one machine, Docker Engine and Compose v2.
#
# Quick start and every setting: README.md. This file is meant to be read and kept as shipped;
# settings go in .env (see bundle.env.example for the bundle's own).
#
#   cd <bundle directory>
#   docker compose up -d --wait
#
# Start-up order (each step must succeed or the stack does not come up):
#   secrets-init -> preflight, postgres -> db-roles -> init -> api -> web -> proxy
#
# What listens where: ONLY `proxy` publishes ports, on DYNODOC_BIND (default 127.0.0.1, this
# machine only). The API and PostgreSQL are on an internal network and cannot be reached from
# outside Docker.
name: dynodoc-selfhosted

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# Applied to every long-running service and job.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  logging: *logging

x-api-image: &api-image ${DYNODOC_IMAGE_REGISTRY:-dynodoc-local}/api:${DYNODOC_VERSION:-dev}
x-postgres-image: &postgres-image ${DYNODOC_POSTGRES_IMAGE:-postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97}

services:
  # --- one-shot jobs -----------------------------------------------------------------------

  # Copies the secret files (and, in `provided` mode, the certificate) into per-service volumes
  # with the right owner and mode. The only container that reads the host's secrets directory.
  secrets-init:
    image: *api-image
    entrypoint: ["/bin/sh", "/jobs/stage-secrets.sh"]
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    environment:
      DYNODOC_TLS_MODE: ${DYNODOC_TLS_MODE:?Set DYNODOC_TLS_MODE in .env to provided, evaluation or acme (see README)}
    tmpfs: ["/tmp:size=8m"]
    volumes:
      - type: bind
        source: ./jobs
        target: /jobs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./.env
        target: /host/env
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./secrets
        target: /host/secrets
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./tls
        target: /host/tls
        read_only: true
        bind: {create_host_path: false}
      - secrets-api:/stage/api
      - secrets-web:/stage/web
      - secrets-db:/stage/db
      - secrets-check:/stage/check
      - secrets-converter:/stage/converter
      - tls-provided:/stage/tls

  # Validates .env and the secrets with the same validator the web server runs at start, before
  # anything else is touched. No network.
  preflight:
    image: ${DYNODOC_IMAGE_REGISTRY:-dynodoc-local}/tools:${DYNODOC_VERSION:-dev}
    entrypoint: ["node", "scripts/dynodoc-env.mjs", "check-config", "--dir", "/run/secrets"]
    user: "10001:10001"
    restart: "no"
    network_mode: none
    <<: *hardening
    tmpfs: ["/tmp:size=8m"]
    volumes:
      - secrets-check:/run/secrets:ro
      - type: bind
        source: ./config
        target: /etc/dynodoc
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      secrets-init: {condition: service_completed_successfully}

  # Creates or updates the restricted runtime login. Runs in the PostgreSQL image (it has psql).
  db-roles:
    image: *postgres-image
    entrypoint: ["/bin/sh", "/jobs/db-roles.sh"]
    user: "999:999"
    restart: "no"
    <<: *hardening
    # The PostgreSQL image declares its data directory as a volume; this job never uses it, and a
    # tmpfs there stops Docker from leaving an empty anonymous volume behind on every run.
    tmpfs: ["/tmp:size=8m", "/var/lib/postgresql/data:size=1m"]
    volumes:
      - secrets-db:/run/secrets:ro
      - type: bind
        source: ./jobs
        target: /jobs
        read_only: true
        bind: {create_host_path: false}
    networks: [engine]
    depends_on:
      postgres: {condition: service_healthy}

  # Migrates as the database owner, grants and checks the runtime login. Never attached to the
  # API or web.
  init:
    image: *api-image
    entrypoint: ["/bin/sh", "/jobs/init.sh"]
    user: "999:999"
    restart: "no"
    <<: *hardening
    tmpfs: ["/tmp:size=8m"]
    volumes:
      - secrets-db:/run/secrets:ro
      - type: bind
        source: ./jobs
        target: /jobs
        read_only: true
        bind: {create_host_path: false}
    networks: [engine]
    depends_on:
      db-roles: {condition: service_completed_successfully}
      preflight: {condition: service_completed_successfully}

  # On demand: checks the mail settings against the real mail server from the same network
  # position as the web server (docker compose run --rm mailcheck --to you@example.org [--send]).
  mailcheck:
    profiles: [maintenance]
    image: ${DYNODOC_IMAGE_REGISTRY:-dynodoc-local}/tools:${DYNODOC_VERSION:-dev}
    entrypoint: ["node", "scripts/check-mail.mjs", "--dir", "/run/secrets"]
    user: "10001:10001"
    restart: "no"
    <<: *hardening
    tmpfs: ["/tmp:size=8m"]
    volumes:
      - secrets-check:/run/secrets:ro
      - type: bind
        source: ./config
        target: /etc/dynodoc
        read_only: true
        bind: {create_host_path: false}
    networks: [egress]
    depends_on:
      secrets-init: {condition: service_completed_successfully}

  # On demand, never started by `up`: engine-cli with the owner credential for operator tasks
  # (docker compose run --rm database-admin verify-snapshots --all). `dynodoctl admin-link` runs
  # `auth issue-link` here to make a one-time sign-in link: the API's login cannot (decision 018).
  database-admin:
    profiles: [maintenance]
    image: *api-image
    entrypoint: ["/bin/sh", "/jobs/engine-cli.sh"]
    user: "999:999"
    restart: "no"
    <<: *hardening
    tmpfs: ["/tmp:size=8m"]
    volumes:
      - secrets-db:/run/secrets:ro
      - type: bind
        source: ./jobs
        target: /jobs
        read_only: true
        bind: {create_host_path: false}
    networks: [engine]
    depends_on:
      postgres: {condition: service_healthy}

  # --- long-running services ---------------------------------------------------------------

  postgres:
    image: *postgres-image
    restart: unless-stopped
    user: "999:999"
    <<: *hardening
    environment:
      POSTGRES_USER: dynodoc
      POSTGRES_DB: dynodoc
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Passwords for every kind of connection, including the local socket (no "trust" lines).
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      TZ: UTC
    tmpfs:
      - /tmp:size=64m
      - /run/postgresql:size=1m,uid=999,gid=999,mode=0755
    shm_size: 256m
    volumes:
      - database:/var/lib/postgresql/data
      - secrets-db:/run/secrets:ro
    networks: [engine]
    healthcheck:
      # TCP on purpose: during first start the image runs a temporary server on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dynodoc -d dynodoc"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    depends_on:
      secrets-init: {condition: service_completed_successfully}

  api:
    image: *api-image
    restart: unless-stopped
    user: "10001:10001"
    <<: *hardening
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      PUBLIC_API_BASE_URL: ${ORIGIN:?Set ORIGIN in .env}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-3600}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DATABASE_URL_FILE: /run/secrets/database_url
      PASETO_LOCAL_KEY_FILE: /run/secrets/paseto_local_key
      WEB_SERVICE_KEY_FILE: /run/secrets/web_service_key
      RETENTION_JOBS: ${RETENTION_JOBS:-on}
      RUST_LOG: ${RUST_LOG:-info}
    tmpfs: ["/tmp:size=64m"]
    volumes:
      - secrets-api:/run/secrets:ro
    networks: [engine]
    healthcheck:
      # The image has bash but no curl: bash's /dev/tcp does the request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\nHost: api\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    depends_on:
      init: {condition: service_completed_successfully}

  web:
    image: ${DYNODOC_IMAGE_REGISTRY:-dynodoc-local}/web:${DYNODOC_VERSION:-dev}
    restart: unless-stopped
    user: "10001:10001"
    <<: *hardening
    # Every web setting comes from .env (README, "Settings"). The lines below are fixed by the
    # bundle and cannot be changed from .env.
    # (`required: false` only so that `docker compose build` works before .env exists; with no
    # .env, secrets-init and preflight stop the stack before the web server could start.)
    env_file:
      - path: ./.env
        required: false
    environment:
      DYNODOC_MODE: selfhosted
      ENGINE_API_URL: http://api:8080
      DEV_AUTH: ${DEV_AUTH:-false}
      SESSION_SECRET_FILE: /run/secrets/session_secret
      WEB_SERVICE_KEY_FILE: /run/secrets/web_service_key
    tmpfs: ["/tmp:size=64m"]
    volumes:
      - secrets-web:/run/secrets:ro
      - type: bind
        source: ./config
        target: /etc/dynodoc
        read_only: true
        bind: {create_host_path: false}
    # frontend: the proxy. engine: the API. conversion: the optional converter. egress: the
    # outbound connections the web server makes (mail server, identity provider); see
    # compose.no-egress.yml to remove it.
    networks: [frontend, engine, conversion, egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    depends_on:
      api: {condition: service_healthy}

  proxy:
    image: ${DYNODOC_IMAGE_REGISTRY:-dynodoc-local}/proxy:${DYNODOC_VERSION:-dev}
    restart: unless-stopped
    user: "101:101"
    <<: *hardening
    environment:
      ORIGIN: ${ORIGIN:?Set ORIGIN in .env}
      DYNODOC_ALT_ORIGINS: ${DYNODOC_ALT_ORIGINS:-}
      DYNODOC_TLS_MODE: ${DYNODOC_TLS_MODE:?Set DYNODOC_TLS_MODE in .env}
      DYNODOC_HSTS_MAX_AGE: ${DYNODOC_HSTS_MAX_AGE:-}
      DYNODOC_TLS_RELOAD_SECONDS: ${DYNODOC_TLS_RELOAD_SECONDS:-60}
    tmpfs: ["/tmp:size=64m"]
    volumes:
      - tls-state:/var/lib/dynodoc-tls
      - tls-provided:/etc/dynodoc/tls:ro
    # The only published ports in the stack. 127.0.0.1 = this machine only; 0.0.0.0 is a decision
    # to make deliberately (README, "Exposure").
    ports:
      - "${DYNODOC_BIND:-127.0.0.1}:${DYNODOC_HTTP_PORT:-80}:8080"
      - "${DYNODOC_BIND:-127.0.0.1}:${DYNODOC_HTTPS_PORT:-443}:8443"
    networks: [published, frontend]
    healthcheck:
      test: ["CMD", "/usr/local/bin/proxy-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    depends_on:
      web: {condition: service_healthy}

  # --- optional: automatic certificates (COMPOSE_PROFILES=acme, DYNODOC_TLS_MODE=acme) -------

  acme:
    profiles: [acme]
    image: ${DYNODOC_IMAGE_REGISTRY:-dynodoc-local}/acme:${DYNODOC_VERSION:-dev}
    restart: unless-stopped
    user: "101:101"
    <<: *hardening
    environment:
      ORIGIN: ${ORIGIN:?Set ORIGIN in .env}
      DYNODOC_ALT_ORIGINS: ${DYNODOC_ALT_ORIGINS:-}
      DYNODOC_ACME_EMAIL: ${DYNODOC_ACME_EMAIL:-}
      DYNODOC_ACME_ACCEPT_TOS: ${DYNODOC_ACME_ACCEPT_TOS:-false}
      DYNODOC_ACME_CA: ${DYNODOC_ACME_CA:-}
      DYNODOC_BIND: ${DYNODOC_BIND:-127.0.0.1}
    tmpfs: ["/tmp:size=16m"]
    volumes:
      - tls-state:/var/lib/dynodoc-tls
    networks: [egress]
    mem_limit: 256m
    cpus: 1
    pids_limit: 64
    depends_on:
      proxy: {condition: service_healthy}

  # --- optional: legacy .doc import (docker compose --profile converter, README) ------------

  converter:
    profiles: [converter]
    image: ${DYNODOC_IMAGE_REGISTRY:-dynodoc-local}/converter:${DYNODOC_VERSION:-dev}
    restart: unless-stopped
    user: "10001:10001"
    # The converter reads its key from the environment; this shell reads it from the staged file.
    entrypoint: ["/bin/sh", "-c", "CONVERTER_KEY=$$(cat /run/secrets/converter_key) exec python3 /app/server.py"]
    <<: *hardening
    tmpfs: ["/tmp:size=256m"]
    volumes:
      - secrets-converter:/run/secrets:ro
    networks: [conversion]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    depends_on:
      secrets-init: {condition: service_completed_successfully}

networks:
  # The proxy's outward side; the only network from which Docker publishes a port.
  published: {}
  # Proxy to web only. The proxy has no route to the API or the database.
  frontend:
    internal: true
  # Web, API, database and the jobs. No route out of Docker.
  engine:
    internal: true
  conversion:
    internal: true
  # Outbound access for the web server (SMTP, OIDC) and the ACME client.
  egress: {}

volumes:
  # PostgreSQL data. The one volume that matters for backup; `docker compose down -v` deletes it.
  database: {}
  # Evaluation certificate and ACME account and certificates.
  tls-state: {}
  # Copies made by secrets-init; safe to delete, rebuilt on every `up`.
  secrets-api: {}
  secrets-web: {}
  secrets-db: {}
  secrets-check: {}
  secrets-converter: {}
  tls-provided: {}
