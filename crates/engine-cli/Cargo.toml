[package]
name = "engine-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
description = "dynodoc admin CLI (migrate, snapshot, verify, replay)."

[[bin]]
name = "engine-cli"
path = "src/main.rs"

[dependencies]
engine-api = { workspace = true }
engine-core = { workspace = true }
engine-shared = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
ring = { workspace = true }
utoipa = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }

# DPAPI (CryptProtectData) for `device ... --keystore` and the no-echo passphrase
# prompt. Windows only; MIT OR Apache-2.0; already part of the build graph (tokio).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console"] }

[dev-dependencies]
axum = { workspace = true }
hex = { workspace = true }
