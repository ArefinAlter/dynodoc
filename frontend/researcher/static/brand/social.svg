<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#faf9f6"/><path d="M735 0h465v630H735z" fill="#e4eefb"/><g transform="translate(64 54) scale(.9)"><title>Dynodoc</title><rect x="5" y="3" width="45" height="54" rx="9" fill="#bed9f4"/><path d="M24 11h18c11 0 18 8 18 20v13c0 11-7 17-18 17H24c-8 0-13-5-13-13V24c0-8 4-13 11-13Z" fill="#2059b0"/><path d="M44 25H33c-7 0-11 4-11 11s4 11 11 11h11V25Z" stroke="#fffdf7" stroke-width="6" stroke-linejoin="round"/><path d="M44 25v-7" stroke="#fffdf7" stroke-width="6" stroke-linecap="round"/><rect x="17" y="45" width="15" height="11" rx="4" fill="#217346"/><path d="m21 50 3 3 5-5" stroke="#fffdf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g><text x="140" y="99" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" letter-spacing="-1" fill="#1a3045">dynodoc.</text><text x="64" y="238" font-family="Arial,Helvetica,sans-serif" font-size="65" font-weight="700" letter-spacing="-2" fill="#1a3045">Every document.</text><text x="64" y="314" font-family="Arial,Helvetica,sans-serif" font-size="65" font-weight="700" letter-spacing="-2" fill="#2059b0">A clear history.</text><text x="67" y="382" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#405469">Version control for documents and spreadsheets.</text><text x="67" y="420" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#405469">Draft. Review. Merge. Keep the story.</text><text x="67" y="549" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#2059b0">dynodoc.online</text><path d="M817 217v190c0 33 30 54 66 54h70M817 261h76c48 0 60 23 60 59v90" stroke="#719fd8" stroke-width="4" fill="none"/><rect x="777" y="138" width="275" height="132" rx="10" fill="#fffdf7" stroke="#aac7eb"/><rect x="800" y="163" width="36" height="40" rx="5" fill="#2059b0"/><text x="850" y="187" font-family="Arial,sans-serif" font-size="19" fill="#1a3045">Team version</text><path d="M803 225h215M803 242h152" stroke="#cad9e8" stroke-width="6" stroke-linecap="round"/><rect x="868" y="333" width="275" height="145" rx="10" fill="#fffdf7" stroke="#aac7eb"/><rect x="890" y="355" width="36" height="40" rx="5" fill="#217346"/><text x="940" y="381" font-family="Arial,sans-serif" font-size="19" fill="#1a3045">Your next idea</text><path d="M895 418h215M895 438h152" stroke="#d5e6dc" stroke-width="6" stroke-linecap="round"/><circle cx="817" cy="318" r="9" fill="#2059b0"/></svg>