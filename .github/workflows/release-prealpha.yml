name: release-prealpha

# Builds the pre-alpha desktop release (Windows x64 NSIS installer and portable zip, Linux x64
# AppImage and .deb, each with the bundled engine-cli) and uploads the assets to an existing
# GitHub release.
#
# MANUAL ONLY for now. The 0.0.1a assets were built on the owner's machine (Windows) and in a local
# Ubuntu 22.04 container (Linux) and uploaded with `gh release upload`, because this account's
# Actions minutes were used up; this file is the same build, kept for later releases. It has no
# tag trigger on purpose, so creating a release tag never starts a billed run. Add
# `push: tags: ["v*"]` when Actions are available again.
#
# Everything here is UNSIGNED. Every cargo and tauri command uses --locked.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to (it must already exist, e.g. v0.0.1a)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-prealpha-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node client/build.mjs --check
      - run: node scripts/prepare-sidecar.mjs
      - run: npm run tauri -- build --bundles nsis --ci -- --locked
      - name: Portable zip and checksums
        shell: pwsh
        run: |
          $v = '${{ inputs.tag }}'
          $out = New-Item -ItemType Directory -Force ../../release-out
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe $out
          $portable = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/Dynodoc-portable"
          Copy-Item src-tauri/target/release/dynodoc-desktop.exe "$portable/Dynodoc.exe"
          Copy-Item src-tauri/binaries/engine-cli-x86_64-pc-windows-msvc.exe "$portable/engine-cli.exe"
          Compress-Archive -Path "$portable/*" -DestinationPath "$out/Dynodoc_${v}_windows-x64-portable.zip"
          Copy-Item src-tauri/binaries/engine-cli-x86_64-pc-windows-msvc.exe "$out/engine-cli_${v}_windows-x64.exe"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" ../../release-out/* --clobber

  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev patchelf file build-essential
      - run: npm ci --ignore-scripts
      - run: node client/build.mjs --check
      - run: node scripts/prepare-sidecar.mjs
      - run: npm run tauri -- build --bundles appimage,deb --ci -- --locked
      - name: Collect
        run: |
          mkdir -p ../../release-out
          cp src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb ../../release-out/
          cp src-tauri/binaries/engine-cli-x86_64-unknown-linux-gnu "../../release-out/engine-cli_${{ inputs.tag }}_linux-x64"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" ../../release-out/* --clobber
