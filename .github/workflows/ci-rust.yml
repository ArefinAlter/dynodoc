name: ci-rust

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "migrations/**"
      - "openapi.yaml"
      - "infra/demo/package-source.py"
      - "infra/demo/test_package_source.py"
      - ".github/workflows/ci-rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "migrations/**"
      - "openapi.yaml"
      - "infra/demo/package-source.py"
      - "infra/demo/test_package_source.py"
      - ".github/workflows/ci-rust.yml"

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dynodoc
          POSTGRES_PASSWORD: dynodoc
          POSTGRES_DB: dynodoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynodoc -d dynodoc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Avoid concurrent database creation during the existing 100 ms SSE assertion.
      RUST_TEST_THREADS: 1
      DATABASE_URL: postgres://dynodoc:dynodoc@127.0.0.1:5432/dynodoc
      # Debug information is most of a test build's size and nothing here reads it.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Free runner disk
        # The workspace's test binaries fill a stock runner (the linker died with a bus
        # error at 72 MB free); the preinstalled SDKs below are not used here.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
      - name: OpenAPI drift check
        run: cargo run -p engine-cli -- openapi | diff - openapi.yaml
      - name: Source packaging regression
        run: python -m unittest discover -s infra/demo -p test_package_source.py
