name: MCP security regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p engine-mcp --test server
      - run: cargo check --locked -p engine-cli
