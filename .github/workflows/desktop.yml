name: desktop

# Builds the desktop client (and the Android and iPhone projects) from apps/desktop.
#
# Manual or tag only, NEVER on a push to a branch or on a pull request: this repository is
# private, so every runner minute is billed, and a macOS minute counts ten times a Linux one.
#   - Manual: Actions > desktop > Run workflow. Linux, Windows and Android are on by default;
#     macOS, iOS and the Arm runners are off until you tick them.
#   - Tag: pushing a tag named desktop-v* (for example desktop-v0.1.0) runs every job except
#     the Arm ones.
#
# Everything built here is UNSIGNED and un-notarised. Signing needs secrets that do not exist
# yet; docs/DESKTOP-AND-MOBILE-APPS.md lists them (do not invent values for them).
#
# BEFORE ANY SIGNING SECRET IS ADDED: anyone who can push a tag can run this workflow, so a tag
# run must first be gated by a protected GitHub environment (Settings > Environments, for
# example "desktop-release", with required reviewers and a tag/branch rule that only allows
# desktop-v* tags created from main), and only the jobs that sign may reference it
# (`environment: desktop-release`), so that the secrets exist only inside that environment.
# Every cargo and tauri command below uses --locked so the build is exactly the lockfile.

on:
  workflow_dispatch:
    inputs:
      linux:
        description: Linux bundles (ubuntu-24.04, x86-64), with the Rust tests
        type: boolean
        default: true
      windows:
        description: Windows bundles (windows-latest, x86-64)
        type: boolean
        default: true
      android:
        description: Android debug APK (ubuntu-24.04)
        type: boolean
        default: true
      macos:
        description: macOS bundles (Apple silicon and Intel; macOS minutes cost 10x Linux)
        type: boolean
        default: false
      ios:
        description: iOS simulator build (macos-latest; 10x cost)
        type: boolean
        default: false
      arm:
        description: Arm bundles on ubuntu-24.04-arm and windows-11-arm (private-repository availability of these runners is unverified)
        type: boolean
        default: false
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Linux x86-64 bundles
    if: github.event_name == 'push' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # AppImage tools run without FUSE on a hosted runner; the strip step of linuxdeploy
      # fails on binaries built with newer toolchains.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - name: Free runner disk
        # The engine's release build plus the bundles fill a stock runner.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-setup
      - name: Build the engine programs for the sidecars
        run: node scripts/prepare-sidecar.mjs
        working-directory: apps/desktop
      - name: Format check
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: PostgreSQL for the bundle
        run: node scripts/prepare-pg.mjs --platform linux
      - name: Bundle
        run: npm run tauri -- build --ci --bundles deb,appimage --config src-tauri/tauri.bundle.conf.json -- --locked
        working-directory: apps/desktop
      - name: Checksums
        run: |
          cd apps/desktop/src-tauri/target/release/bundle
          rm -rf appimage/*.AppDir
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print0 | xargs -0 sha256sum | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dynodoc-desktop-linux-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x86-64 bundles
    if: github.event_name == 'push' || inputs.windows
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        # A comma list such as nsis,msi is passed through unchanged by bash, not by PowerShell.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-setup
      - name: Build the engine programs for the sidecars
        run: node scripts/prepare-sidecar.mjs
        working-directory: apps/desktop
      - name: Tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: PostgreSQL for the bundle
        run: node scripts/prepare-pg.mjs
      - name: Bundle
        run: npm run tauri -- build --ci --bundles nsis --config src-tauri/tauri.bundle.conf.json -- --locked
        working-directory: apps/desktop
      - name: Checksums
        run: |
          cd apps/desktop/src-tauri/target/release/bundle
          find . -type f \( -name '*.exe' -o -name '*.msi' \) -print0 | xargs -0 sha256sum | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dynodoc-desktop-windows-x64
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }} bundles
    if: github.event_name == 'push' || inputs.macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple silicon
            arch: aarch64
          - os: macos-15-intel # Intel
            arch: x86-64
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-setup
      - name: Build the engine programs for the sidecars
        run: node scripts/prepare-sidecar.mjs
        working-directory: apps/desktop
      - name: Tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Bundle
        run: npm run tauri -- build --ci --bundles app,dmg -- --locked
        working-directory: apps/desktop
      - name: Checksums
        run: |
          cd apps/desktop/src-tauri/target/release/bundle
          find . -type f -name '*.dmg' -print0 | xargs -0 shasum -a 256 | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dynodoc-desktop-macos-${{ matrix.arch }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  arm:
    name: Arm bundles (${{ matrix.os }})
    # Unverified: whether a private repository can use these runners. If it cannot, the job
    # fails at once with "no runner" and costs nothing.
    if: github.event_name == 'workflow_dispatch' && inputs.arm
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            bundles: deb,appimage
          - os: windows-11-arm
            bundles: nsis
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-setup
      - name: Build the engine programs for the sidecars
        run: node scripts/prepare-sidecar.mjs
        working-directory: apps/desktop
      - name: Tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Bundle
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundles }} -- --locked
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: dynodoc-desktop-arm-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android debug APK
    # NEVER RUN IN CI so far: this repository's Actions cannot start jobs (billing). Every step
    # below was run by hand on a Windows PC, but the Windows PC needs scripts/android-build.ps1
    # instead of `tauri android build` (no right to create symbolic links), so this exact job
    # (Linux, `tauri android build`, the sdkmanager line) has not been executed anywhere.
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Free runner disk (keeps the Android SDK and NDK of the runner image)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-setup
        with:
          targets: aarch64-linux-android x86_64-linux-android
          linux-packages: "false"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the exact Android build tools this was run with
        # The versions of docs/DESKTOP-AND-MOBILE-APPS.md (run on a Windows PC on 22 October 2026).
        # `yes` answers the licence prompts of only the packages named here.
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$sdk/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Test the Android scripts, and check the committed project is hardened
        # The Android project is COMMITTED (src-tauri/gen/android), so there is no `android init`
        # here. scripts/harden-android.mjs --check rewrites nothing and fails unless allowBackup is
        # "false", the data extraction rules exclude everything and cleartext traffic is off in
        # every build type.
        run: |
          node --test scripts/*.test.mjs
          node scripts/harden-android.mjs --check
        working-directory: apps/desktop
      - name: Make the Gradle wrapper executable (the bit is set in the index; this is belt and braces)
        run: chmod +x src-tauri/gen/android/gradlew
        working-directory: apps/desktop
      - name: Build the debug APK (arm64 and x86-64 in one universal APK)
        run: npm run tauri -- android build --ci --debug --apk --target aarch64 x86_64 -- --locked
        working-directory: apps/desktop
      - name: Kotlin unit tests (download names, origins), with Gradle's dependency verification on
        # Plain JVM tests of the pure helpers in gen/android (DownloadNames, Origins). The rustBuild
        # tasks are skipped: the library was just built by the step above.
        run: ./gradlew testUniversalDebugUnitTest -PabiList=arm64-v8a,x86_64 -ParchList=arm64,x86_64 -PtargetList=aarch64,x86_64 -x rustBuildArm64Debug -x rustBuildX86_64Debug -x rustBuildUniversalDebug --no-daemon
        working-directory: apps/desktop/src-tauri/gen/android
      - name: Check the MERGED manifest and the signing key inside the built APK
        # The text check above looks at the project; this looks at what shipped, after Gradle
        # merged every library's manifest and applied the build type's placeholders. aapt2 prints
        # the manifest tree; the job fails unless backup and cleartext are off, only INTERNET is
        # requested, only MainActivity (and AndroidX's DUMP-guarded profile receiver) is
        # exported, the link filters are only dynodoc://open/..., and the APK carries the SDK's
        # debug key. The parsers were tested on REAL aapt2, apkanalyzer and apksigner output of
        # this tool chain (scripts/fixtures).
        run: |
          apks=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk')
          test -n "$apks" || { echo "no APK built"; exit 1; }
          for apk in $apks; do
            echo "== $apk"
            node scripts/check-apk-manifest.mjs "$apk" --build debug
          done
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: dynodoc-android-debug-apk
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator build
    # Unverified end to end: `tauri ios init` and `tauri ios build` without a development
    # team. A failure here is information, not a release blocker, hence continue-on-error.
    if: github.event_name == 'push' || inputs.ios
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-setup
        with:
          targets: aarch64-apple-ios-sim
      - name: Install xcodegen (used by `tauri ios init`)
        run: brew install xcodegen
      - name: Generate the Xcode project (not committed)
        run: npm run tauri -- ios init --ci
        working-directory: apps/desktop
      - name: Build for the simulator, unsigned
        run: npm run tauri -- ios build --ci --debug --target aarch64-sim -- --locked
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: dynodoc-ios-simulator
          path: |
            apps/desktop/src-tauri/gen/apple/build/**/*.app
            apps/desktop/src-tauri/gen/apple/build/**/*.xcarchive
          if-no-files-found: warn
          retention-days: 7
