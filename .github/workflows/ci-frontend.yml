name: ci-frontend

on:
  push:
    paths:
      - "frontend/**"
      - "extensions/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "migrations/**"
      - "infra/demo/nginx-app.conf"
      - "infra/demo/nginx-admin.conf"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "extensions/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "migrations/**"
      - "infra/demo/nginx-app.conf"
      - "infra/demo/nginx-admin.conf"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend/researcher

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/researcher/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint (eslint + svelte-check)
        run: pnpm lint
      - name: Verify shared Google Docs connector build
        run: pnpm check:connectors
      - name: Format check
        run: pnpm format:check
      - name: Build
        run: pnpm build
      # Every hosted hostname, operator fact and third-party host left in the build must be in
      # scripts/hosted-strings-known.json (the list can only shrink; docs/SELF-HOSTED-EDITION.md 13.2).
      - name: Hosted-string audit of the build
        run: node scripts/audit-hosted-strings.mjs --check
      - name: Unit tests (vitest)
        run: pnpm test:unit
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests (playwright)
        run: pnpm test:e2e

  authenticated-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dynodoc
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: dynodoc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dynodoc -d dynodoc"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://dynodoc_runtime:isolated-ci-runtime-only@127.0.0.1:5432/dynodoc
      PASETO_LOCAL_KEY: '0707070707070707070707070707070707070707070707070707070707070707'
      WEB_SERVICE_KEY: isolated-ci-service-key-never-for-production
      SESSION_SECRET: isolated-ci-session-key-never-for-production
      ADMIN_EMAILS: admin@example.test
      APP_ENV: test
      DEV_AUTH: 'true'
      API_HOST: 127.0.0.1
      API_PORT: '8080'
      ENGINE_API_URL: http://127.0.0.1:8080
      ORIGIN: http://127.0.0.1:4173
      HOST: 127.0.0.1
      PORT: '4173'
      BODY_SIZE_LIMIT: 16M
      PILOT_E2E: 'true'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      # The agent routes exist only when the gateway is on; agent-proposals.spec.ts drives them.
      AGENT_GATEWAY: 'on'
      # Self-hosted mode on the same build and API (started below); selfhosted*.spec.ts run against these.
      SELFHOSTED_BASE_URL: http://127.0.0.1:4174
      SELFHOSTED_NOEMAIL_BASE_URL: http://127.0.0.1:4175
      # Self-hosted, mail through SMTP to the mail server selfhosted-smtp.spec.ts starts (port 2526).
      SELFHOSTED_SMTP_BASE_URL: http://127.0.0.1:4176
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/researcher/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p engine-api -p engine-cli
        working-directory: .
      - name: Migrate separately and provision the restricted API login
        working-directory: .
        env:
          MIGRATION_DATABASE_URL: postgres://dynodoc:isolated-ci-only@127.0.0.1:5432/dynodoc
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U dynodoc -d dynodoc -v ON_ERROR_STOP=1 -c "CREATE ROLE dynodoc_runtime LOGIN PASSWORD 'isolated-ci-runtime-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          target/debug/engine-cli migrate
          target/debug/engine-cli grant-runtime dynodoc_runtime
          target/debug/engine-cli check-runtime
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated authenticated stack
        run: |
          ../../target/debug/engine-api > /tmp/dynodoc-api.log 2>&1 &
          echo $! > /tmp/dynodoc-api.pid
          node build > /tmp/dynodoc-web.log 2>&1 &
          echo $! > /tmp/dynodoc-web.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null && curl -fsS http://127.0.0.1:4173/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Start the self-hosted web servers (DYNODOC_MODE=selfhosted, settings in e2e/selfhosted.env)
        run: |
          umask 077
          printf '%s' "$SESSION_SECRET" > /tmp/dynodoc-session-secret
          printf '%s' "$WEB_SERVICE_KEY" > /tmp/dynodoc-web-service-key
          # The first reads its secrets from files, as an installation does; the second takes
          # them as variables and has email sign-in off.
          env -u SESSION_SECRET -u WEB_SERVICE_KEY \
            SESSION_SECRET_FILE=/tmp/dynodoc-session-secret WEB_SERVICE_KEY_FILE=/tmp/dynodoc-web-service-key \
            ORIGIN=http://127.0.0.1:4174 PORT=4174 \
            node --env-file=e2e/selfhosted.env build > /tmp/dynodoc-self.log 2>&1 &
          echo $! > /tmp/dynodoc-self.pid
          AUTH_EMAIL_LINK=off ORIGIN=http://127.0.0.1:4175 PORT=4175 \
            node --env-file=e2e/selfhosted.env build > /tmp/dynodoc-noemail.log 2>&1 &
          echo $! > /tmp/dynodoc-noemail.pid
          # The third sends its mail through SMTP and has no development shortcut (DEV_AUTH off).
          DEV_AUTH=false ORIGIN=http://127.0.0.1:4176 PORT=4176 \
            node --env-file=e2e/selfhosted.env --env-file=e2e/selfhosted-smtp.env build > /tmp/dynodoc-smtp.log 2>&1 &
          echo $! > /tmp/dynodoc-smtp.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4174/healthz >/dev/null && curl -fsS http://127.0.0.1:4175/healthz >/dev/null && curl -fsS http://127.0.0.1:4176/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Install Nginx for production proxy regression
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
      - name: Production proxy header regression
        run: node scripts/check-proxy-headers.mjs
      - name: Browser workflows with real local sessions
        # The operator-issued sign-in link specs (selfhosted-noemail.spec.ts) run the built engine-cli
        # with the database OWNER credential, as an operator would. Only this step has it: the API
        # and the web servers started above never see it.
        env:
          MIGRATION_DATABASE_URL: postgres://dynodoc:isolated-ci-only@127.0.0.1:5432/dynodoc
          ENGINE_CLI: ../../target/debug/engine-cli
        run: pnpm test:e2e
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-workflow-failure
          path: |
            frontend/researcher/test-results
            /tmp/dynodoc-api.log
            /tmp/dynodoc-web.log
            /tmp/dynodoc-self.log
            /tmp/dynodoc-noemail.log
            /tmp/dynodoc-smtp.log
          retention-days: 7
      - name: Stop test processes
        if: always()
        run: |
          for file in /tmp/dynodoc-api.pid /tmp/dynodoc-web.pid /tmp/dynodoc-self.pid /tmp/dynodoc-noemail.pid /tmp/dynodoc-smtp.pid; do
            if [ -f "$file" ]; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done

  # Smoke subset (tests tagged @smoke) on the engines and devices Chromium does not cover:
  # Firefox, WebKit and Pixel and iPhone emulation (docs/BROWSER-SUPPORT.md). The full suite
  # stays on Chromium in the jobs above, so this job adds time in parallel, not in series.
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dynodoc
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: dynodoc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dynodoc -d dynodoc"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://dynodoc_runtime:isolated-ci-runtime-only@127.0.0.1:5432/dynodoc
      PASETO_LOCAL_KEY: '0707070707070707070707070707070707070707070707070707070707070707'
      WEB_SERVICE_KEY: isolated-ci-service-key-never-for-production
      SESSION_SECRET: isolated-ci-session-key-never-for-production
      ADMIN_EMAILS: admin@example.test
      APP_ENV: test
      DEV_AUTH: 'true'
      API_HOST: 127.0.0.1
      API_PORT: '8080'
      ENGINE_API_URL: http://127.0.0.1:8080
      ORIGIN: http://127.0.0.1:4173
      HOST: 127.0.0.1
      PORT: '4173'
      BODY_SIZE_LIMIT: 16M
      PILOT_E2E: 'true'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
      BROWSER_MATRIX: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/researcher/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p engine-api -p engine-cli
        working-directory: .
      - name: Migrate separately and provision the restricted API login
        working-directory: .
        env:
          MIGRATION_DATABASE_URL: postgres://dynodoc:isolated-ci-only@127.0.0.1:5432/dynodoc
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U dynodoc -d dynodoc -v ON_ERROR_STOP=1 -c "CREATE ROLE dynodoc_runtime LOGIN PASSWORD 'isolated-ci-runtime-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          target/debug/engine-cli migrate
          target/debug/engine-cli grant-runtime dynodoc_runtime
          target/debug/engine-cli check-runtime
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The browser downloads are the slow part; the system packages are cheap and always installed.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/researcher/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Start isolated authenticated stack
        run: |
          ../../target/debug/engine-api > /tmp/dynodoc-api.log 2>&1 &
          echo $! > /tmp/dynodoc-api.pid
          node build > /tmp/dynodoc-web.log 2>&1 &
          echo $! > /tmp/dynodoc-web.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null && curl -fsS http://127.0.0.1:4173/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Smoke tests on Firefox, WebKit and phone emulation
        run: pnpm exec playwright test --project=firefox --project=webkit --project=pixel --project=iphone
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browsers-failure
          path: |
            frontend/researcher/test-results
            /tmp/dynodoc-api.log
            /tmp/dynodoc-web.log
          retention-days: 7
      - name: Stop test processes
        if: always()
        run: |
          for file in /tmp/dynodoc-api.pid /tmp/dynodoc-web.pid; do
            if [ -f "$file" ]; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done
