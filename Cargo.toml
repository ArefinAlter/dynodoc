[workspace]
resolver = "2"
members = [
    "crates/engine-shared",
    "crates/engine-core",
    "crates/engine-api",
    "crates/engine-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license-file = "LICENSE"
publish = false
repository = "https://github.com/vernehq/dynodoc"
authors = ["Verne Ltd."]

# Shared dependency versions — crates reference these with `{ workspace = true }`
# so the whole engine pins one version of each. Starter set per
# docs/12-build-repo-and-environment.md; schema/event logic lands in later stages.
[workspace.dependencies]
# Async runtime + web
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "compression-gzip", "trace", "limit"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Opaque cursor encoding for cursor pagination (stage 18).
base64 = "0.22"

# OpenAPI generation from the Axum handlers (stage 18). `utoipa` derives the schema +
# path items; `utoipa`'s `axum_extras` keeps the derives aware of the Axum extractors.
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "yaml"] }

# Identity + time
ulid = "3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Crypto: ring per docs/11 (audited, fast SHA-256 for the hash chain; Ed25519 for
# signatures later). ring's build-script binary is blocked by Smart App Control on
# the laptop, so the engine is built/run on a SAC-free machine (home PC / WSL2 / CI).
ring = "0.17"

# Auth: Paseto v4 local tokens (symmetric AEAD) instead of JWT — no alg-confusion or
# `none`-algorithm footguns (docs/17, NFR-8). `hex` decodes the 32-byte signing key.
pasetors = "0.7"
hex = "0.4"

# Errors + logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Internal crates
engine-shared = { path = "crates/engine-shared" }
engine-core = { path = "crates/engine-core" }
engine-api = { path = "crates/engine-api" }

# Dev / test
proptest = "1"
tokio-test = "0.4"
insta = { version = "1", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
