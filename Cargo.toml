[workspace]
resolver = "2"
members = [
    "crates/engine-shared",
    "crates/engine-core",
    "crates/engine-api",
    "crates/engine-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/vernehq/dynodoc"
authors = ["dynodoc contributors"]

# Shared dependency versions — crates reference these with `{ workspace = true }`
# so the whole engine pins one version of each. Starter set per
# docs/12-build-repo-and-environment.md; schema/event logic lands in later stages.
[workspace.dependencies]
# Async runtime + web
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }

# Database
# native-tls (Windows SChannel) instead of rustls: rustls pulls `ring`
# transitively, whose build-script binary is blocked by Smart App Control on the
# dev machine. native-tls uses the OS TLS stack and has no such build script.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identity + time
ulid = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Crypto (hash chain). RustCrypto `sha2` (pure Rust, no build script) is used
# instead of the doc's `ring`: Smart App Control (enforce mode) on the Windows dev
# machine blocks ring's freshly-built build-script binary. Ed25519 signatures
# (later stages) will use `ed25519-dalek` for the same reason.
sha2 = "0.10"

# Errors + logging
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Internal crates
engine-shared = { path = "crates/engine-shared" }
engine-core = { path = "crates/engine-core" }

# Dev / test
proptest = "1"
tokio-test = "0.4"
insta = { version = "1", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
