# Dynodoc desktop shell (Tauri 2). A Cargo workspace of its own, excluded from the engine
# workspace at the repository root, so the engine's CI never needs webkit/GTK libraries.
[workspace]

[package]
name = "dynodoc-desktop"
# The app version: tauri.conf.json has no "version" and falls back to this on desktop. Android's
# Tauri command line does not fall back, so tauri.android.conf.json repeats it (a test keeps the
# two equal; change both together).
version = "0.0.1-beta"
description = "Dynodoc desktop client: a native shell around the configured Dynodoc server."
edition = "2021"
license-file = "../../../LICENSE"
publish = false
repository = "https://github.com/vernehq/dynodoc"
authors = ["Verne Ltd."]

[lib]
# The library name must differ from the binary name on Windows. crate-type is what Tauri 2
# mobile needs (staticlib for iOS, cdylib for Android); rlib serves the desktop binary and tests.
name = "dynodoc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No optional features: a release build has no web inspector (debug builds always do), no
# tray icon and no asset protocol. A test fails if one is added.
tauri = { version = "2.12", features = [] }
# Opens http(s) and mailto links in the system browser. Rust API only; no capability grants
# its page-facing commands.
tauri-plugin-opener = "2"
# The dynodoc:// scheme. Registered on every platform; mobile configuration is not done yet.
tauri-plugin-deep-link = "2"
# Used by the navigation policy and the address validator (re-exported by tauri as tauri::Url).
url = "2"
# SHA-256 of the saved config, kept as a seal in the local data folder (config.rs). Already
# part of Tauri's own dependency tree.
sha2 = "0.10"
# The click secret comes straight from the operating system (handoff.rs). Already in the tree.
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The client's requests to the configured server (remote.rs): no redirects, the operating system's
# certificate store (rustls-platform-verifier), ring as the one crypto provider. No cookie jar: the
# session cookie is the web view's own, read per request.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# One running copy; a second launch (or a dynodoc:// link) is forwarded to the first.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Remembers the window's size, position and maximised state.
tauri-plugin-window-state = "2"

# --- The local workspace (0.0.1b, decision 019): the app starts and supervises its own database and
# engine on loopback, so it needs a process supervisor, a PostgreSQL client for the app-side state,
# the operating system's credential store, and a few small helpers. ---
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "process", "net", "time", "sync", "io-util", "fs"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-serde_json-1"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Windows Credential Manager, macOS Keychain, Linux Secret Service (no libdbus: zbus). Secrets for the
# local database and engine, sign-in tokens per server, and the user's provider keys live there.
keyring = "4"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
# The provider keys file, where there is no credential store: Argon2id from a passphrase, then
# XChaCha20-Poly1305 (RustCrypto).
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.10"
# The backup archive (one .zip of the local workspace).
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies.rfd]
# Native open and save dialogs, called from Rust only (the page has no file access).
version = "0.17"
default-features = false
features = ["gtk3"]

[target.'cfg(windows)'.dependencies]
# Keeps the engine process inside a job that dies with the app (a crash leaves no orphan).
win32job = "2"
# Windows only: window.rs adds the app's `DynodocApp/<version> (desktop)` token to WebView2's own
# User-Agent. Both are already in the tree (Tauri's web view layer uses them), at these versions.
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
